name: Apply simple provider migration

on:
  push:
    branches: [fix/simple-provider-migration]
    paths: [.github/workflows/apply-simple-provider-migration.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-provider-migration
          fetch-depth: 0
      - name: Apply migration and UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found: {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Prisma: preserve pre-migration usage as an offset over the new provider's counter.
          replace(
              "apps/control-plane/prisma/schema.prisma",
              '  externalUsername  String\n  configFingerprint String?\n',
              '  externalUsername  String\n  usageOffsetBytes  BigInt    @default(0)\n  configFingerprint String?\n',
          )
          migration = Path("apps/control-plane/prisma/migrations/20260816175000_provider_migration_usage_offset/migration.sql")
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''-- Preserve already-consumed traffic when a service is moved to a different PasarGuard provider.\nALTER TABLE "PasarGuardBinding"\nADD COLUMN IF NOT EXISTS "usageOffsetBytes" BIGINT NOT NULL DEFAULT 0;\n''')

          # Sync: effective NimHUB usage = pre-cutover usage offset + new-provider usage.
          replace(
              "apps/control-plane/src/lib/pasarguard/sync.ts",
              '''function serviceState(user: PasarGuardUser) {\n  const now = Date.now();\n  const expired = user.expiresAt ? user.expiresAt.getTime() <= now : false;\n  const active = user.status.toLowerCase() === "active" && !expired;\n  const quotaBytes = user.dataLimit ?? (user.usedTraffic > UNLIMITED_QUOTA_BYTES\n    ? user.usedTraffic + 1024n ** 4n\n    : UNLIMITED_QUOTA_BYTES);\n  return {\n    status: expired ? "EXPIRED" as const : active ? "ACTIVE" as const : "SUSPENDED" as const,\n    quotaBytes,\n    usedBytes: user.usedTraffic,\n    expiresAt: user.expiresAt ?? UNLIMITED_EXPIRY,\n    maxDevices: user.maxDevices ?? 1,\n  };\n}\n''',
              '''function serviceState(user: PasarGuardUser, usageOffsetBytes = 0n, fallbackQuotaBytes?: bigint) {\n  const now = Date.now();\n  const expired = user.expiresAt ? user.expiresAt.getTime() <= now : false;\n  const active = user.status.toLowerCase() === "active" && !expired;\n  const remoteQuotaBytes = user.dataLimit ?? (user.usedTraffic > UNLIMITED_QUOTA_BYTES\n    ? user.usedTraffic + 1024n ** 4n\n    : UNLIMITED_QUOTA_BYTES);\n  const quotaBytes = user.dataLimit === null && usageOffsetBytes > 0n && fallbackQuotaBytes !== undefined\n    ? fallbackQuotaBytes\n    : usageOffsetBytes + remoteQuotaBytes;\n  return {\n    status: expired ? "EXPIRED" as const : active ? "ACTIVE" as const : "SUSPENDED" as const,\n    quotaBytes,\n    usedBytes: usageOffsetBytes + user.usedTraffic,\n    expiresAt: user.expiresAt ?? UNLIMITED_EXPIRY,\n    maxDevices: user.maxDevices ?? 1,\n  };\n}\n''',
          )
          replace(
              "apps/control-plane/src/lib/pasarguard/sync.ts",
              ''') {\n  const state = serviceState(user);\n  return db.$transaction(async (tx) => {\n''',
              ''') {\n  return db.$transaction(async (tx) => {\n''',
          )
          replace(
              "apps/control-plane/src/lib/pasarguard/sync.ts",
              '''        id: true,\n        serviceId: true,\n        service: { select: { status: true } },\n''',
              '''        id: true,\n        serviceId: true,\n        usageOffsetBytes: true,\n        service: { select: { status: true, quotaBytes: true } },\n''',
          )
          replace(
              "apps/control-plane/src/lib/pasarguard/sync.ts",
              '''    if (!binding) throw new PasarGuardError("invalid_response", "اتصال پاسارگارد در QuickPing پیدا نشد");\n\n    await tx.service.update({\n''',
              '''    if (!binding) throw new PasarGuardError("invalid_response", "اتصال پاسارگارد در QuickPing پیدا نشد");\n    const state = serviceState(user, binding.usageOffsetBytes, binding.service.quotaBytes);\n\n    await tx.service.update({\n''',
          )
          sync_path = Path("apps/control-plane/src/lib/pasarguard/sync.ts")
          sync_text = sync_path.read_text()
          refresh_start = sync_text.index('export async function refreshPasarGuardBindingsForUser')
          sync_text = sync_text[:refresh_start] + '''export async function refreshPasarGuardBindingsForUser(userId: string): Promise<void> {\n  if (!await isPasarGuardConfigured()) return;\n  try {\n    // Creating the active client also imports a legacy ENV provider once when needed.\n    const client = await createPasarGuardClient();\n    if (!client.providerId) return;\n    const staleBefore = new Date(Date.now() - STALE_AFTER_MS);\n    const bindings = await db.pasarGuardBinding.findMany({\n      where: {\n        service: { userId },\n        providerId: client.providerId,\n        OR: [{ lastSyncAt: null }, { lastSyncAt: { lt: staleBefore } }],\n      },\n      select: { id: true },\n    });\n    if (!bindings.length) return;\n    await Promise.allSettled(bindings.map((binding) => syncPasarGuardBinding(binding.id, client)));\n  } catch {\n    // A provider outage must not prevent the client from receiving its last known-good bootstrap.\n  }\n}\n'''
          sync_path.write_text(sync_text)

          # Provider migration engine with quota/usage continuity and rollback.
          Path("apps/control-plane/src/lib/pasarguard/migration.ts").write_text('''import { db } from "@/lib/db";\nimport { PasarGuardError, type PasarGuardClient, type PasarGuardUser } from "@/lib/pasarguard/client";\nimport {\n  createPasarGuardClient,\n  discoverPasarGuardProfiles,\n} from "@/lib/pasarguard/provider";\nimport { syncPasarGuardBinding } from "@/lib/pasarguard/sync";\n\nexport type MigrationTransferShape = {\n  usageOffsetBytes: bigint;\n  remoteDataLimitBytes: bigint;\n  remainingBytes: bigint;\n};\n\nexport function migrationTransferShape(\n  totalBytes: bigint,\n  usedBytes: bigint,\n  remoteUsedBytes: bigint,\n): MigrationTransferShape {\n  if (totalBytes <= 0n || usedBytes < 0n || remoteUsedBytes < 0n) {\n    throw new PasarGuardError("invalid_response", "وضعیت حجم سرویس برای انتقال معتبر نیست");\n  }\n  if (usedBytes >= totalBytes) {\n    throw new PasarGuardError("invalid_response", "حجم این سرویس تمام شده است؛ پس از افزایش حجم می‌توان آن را منتقل کرد");\n  }\n  if (remoteUsedBytes > usedBytes) {\n    throw new PasarGuardError(\n      "invalid_response",\n      "کاربر هم‌نام در پنل جدید مصرف بیشتری از سابقه NimHUB دارد و نیازمند بررسی دستی است",\n    );\n  }\n  const remainingBytes = totalBytes - usedBytes;\n  const usageOffsetBytes = usedBytes - remoteUsedBytes;\n  const remoteDataLimitBytes = totalBytes - usageOffsetBytes;\n  if (remoteDataLimitBytes <= remoteUsedBytes) {\n    throw new PasarGuardError("invalid_response", "حجم باقی‌مانده برای انتقال معتبر نیست");\n  }\n  return { usageOffsetBytes, remoteDataLimitBytes, remainingBytes };\n}\n\nfunction mappingGroups(value: unknown): number[] {\n  if (!Array.isArray(value)) return [];\n  return [...new Set(value\n    .map((item) => Number(item))\n    .filter((item) => Number.isSafeInteger(item) && item > 0))]\n    .sort((a, b) => a - b);\n}\n\ntype MigrationOptions = {\n  client?: PasarGuardClient;\n  profileKey?: string;\n  visibleUsers?: PasarGuardUser[];\n};\n\nexport async function migratePasarGuardBindingToActiveProvider(\n  bindingId: string,\n  options: MigrationOptions = {},\n) {\n  const client = options.client ?? await createPasarGuardClient();\n  if (!client.providerId) throw new PasarGuardError("not_configured", "Provider فعال پاسارگارد شناسه معتبر ندارد");\n\n  const binding = await db.pasarGuardBinding.findUnique({\n    where: { id: bindingId },\n    include: {\n      service: {\n        select: {\n          id: true,\n          planId: true,\n          status: true,\n          quotaBytes: true,\n          usedBytes: true,\n          expiresAt: true,\n          maxDevices: true,\n        },\n      },\n    },\n  });\n  if (!binding) throw new PasarGuardError("invalid_response", "اتصال سرویس پاسارگارد پیدا نشد");\n  if (binding.providerId === client.providerId && binding.lastSyncAt) {\n    return {\n      migrated: false,\n      alreadyActiveProvider: true,\n      bindingId: binding.id,\n      serviceId: binding.service.id,\n      previousProviderId: binding.providerId,\n      providerId: client.providerId,\n      externalUserId: binding.externalUserId,\n      profileKey: options.profileKey ?? null,\n      usageOffsetBytes: binding.usageOffsetBytes,\n      remoteUser: null as PasarGuardUser | null,\n    };\n  }\n\n  let profileKey = options.profileKey;\n  let profileName = "";\n  let groupIds: number[] = [];\n  if (profileKey) {\n    const profiles = await discoverPasarGuardProfiles(client);\n    const profile = profiles.find((item) => item.key === profileKey);\n    if (!profile || !profile.groupIds.length) {\n      throw new PasarGuardError("invalid_response", "گروه یا قالب انتخاب‌شده در پنل فعال وجود ندارد");\n    }\n    profileName = profile.name;\n    groupIds = profile.groupIds;\n    await db.pasarGuardPlanMapping.upsert({\n      where: { providerId_planId: { providerId: client.providerId, planId: binding.service.planId } },\n      update: {\n        profileKey: profile.key,\n        profileName: profile.name,\n        groupIds: profile.groupIds,\n        valid: true,\n        lastValidatedAt: new Date(),\n      },\n      create: {\n        providerId: client.providerId,\n        planId: binding.service.planId,\n        profileKey: profile.key,\n        profileName: profile.name,\n        groupIds: profile.groupIds,\n        valid: true,\n        lastValidatedAt: new Date(),\n      },\n    });\n  } else {\n    const mapping = await db.pasarGuardPlanMapping.findUnique({\n      where: { providerId_planId: { providerId: client.providerId, planId: binding.service.planId } },\n    });\n    if (!mapping?.valid) {\n      throw new PasarGuardError("invalid_response", "برای پلن این سرویس هنوز گروه پنل فعال انتخاب نشده است");\n    }\n    groupIds = mappingGroups(mapping.groupIds);\n    if (!groupIds.length) throw new PasarGuardError("invalid_response", "گروه ثبت‌شده برای پلن معتبر نیست");\n    profileKey = mapping.profileKey;\n    profileName = mapping.profileName;\n  }\n\n  const visibleUsers = options.visibleUsers ?? await client.listUsers();\n  const summary = visibleUsers.find((item) => item.username.toLowerCase() === binding.externalUsername.toLowerCase());\n  let remote = summary ? await client.getUserByUsername(summary.username) : null;\n  const remoteSnapshot = remote;\n  let createdRemote = false;\n\n  if (remote) {\n    const conflicting = await db.pasarGuardBinding.findFirst({\n      where: {\n        providerId: client.providerId,\n        externalUserId: BigInt(remote.id),\n        id: { not: binding.id },\n      },\n      select: { id: true },\n    });\n    if (conflicting) {\n      throw new PasarGuardError("invalid_response", "این کاربر در پنل جدید قبلاً به سرویس دیگری متصل شده است");\n    }\n  }\n\n  const transfer = migrationTransferShape(\n    binding.service.quotaBytes,\n    binding.service.usedBytes,\n    remote?.usedTraffic ?? 0n,\n  );\n\n  if (remote) {\n    remote = await client.updateUser(remote.username, {\n      dataLimit: transfer.remoteDataLimitBytes,\n      expiresAt: binding.service.expiresAt,\n      maxDevices: binding.service.maxDevices,\n      status: binding.service.status === "ACTIVE" ? "active" : "disabled",\n      groupIds,\n      note: `NimHUB provider migration (${profileName})`,\n    });\n  } else {\n    remote = await client.createUser(\n      binding.externalUsername,\n      transfer.remoteDataLimitBytes,\n      groupIds,\n      `NimHUB provider migration (${profileName})`,\n      binding.service.maxDevices,\n      binding.service.expiresAt,\n    );\n    createdRemote = true;\n    if (binding.service.status !== "ACTIVE") {\n      remote = await client.updateUser(remote.username, { status: "disabled" });\n    }\n  }\n\n  try {\n    await db.pasarGuardBinding.update({\n      where: { id: binding.id },\n      data: {\n        providerId: client.providerId,\n        externalUserId: BigInt(remote.id),\n        externalUsername: remote.username,\n        usageOffsetBytes: transfer.usageOffsetBytes,\n        lastSyncAt: null,\n        lastError: null,\n      },\n    });\n    await syncPasarGuardBinding(binding.id, client);\n  } catch (error) {\n    await db.pasarGuardBinding.update({\n      where: { id: binding.id },\n      data: {\n        providerId: binding.providerId,\n        externalUserId: binding.externalUserId,\n        externalUsername: binding.externalUsername,\n        usageOffsetBytes: binding.usageOffsetBytes,\n        configFingerprint: binding.configFingerprint,\n        lastSyncAt: binding.lastSyncAt,\n        lastError: binding.lastError,\n      },\n    }).catch(() => undefined);\n    if (createdRemote) {\n      await client.deleteUser(remote.username).catch(() => undefined);\n    } else if (remoteSnapshot) {\n      await client.updateUser(remoteSnapshot.username, {\n        dataLimit: remoteSnapshot.dataLimit ?? binding.service.quotaBytes,\n        expiresAt: remoteSnapshot.expiresAt,\n        maxDevices: remoteSnapshot.maxDevices ?? binding.service.maxDevices,\n        status: remoteSnapshot.status,\n        ...(remoteSnapshot.groupIds.length ? { groupIds: remoteSnapshot.groupIds } : {}),\n      }).catch(() => undefined);\n    }\n    throw error;\n  }\n\n  return {\n    migrated: true,\n    alreadyActiveProvider: false,\n    bindingId: binding.id,\n    serviceId: binding.service.id,\n    previousProviderId: binding.providerId,\n    providerId: client.providerId,\n    externalUserId: BigInt(remote.id),\n    profileKey,\n    usageOffsetBytes: transfer.usageOffsetBytes,\n    remainingBytes: transfer.remainingBytes,\n    remoteUser: remote,\n  };\n}\n''')

          Path("apps/control-plane/src/lib/pasarguard/migration.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { migrationTransferShape } from "./migration";\n\nconst GB = 1024n ** 3n;\n\ndescribe("PasarGuard provider migration traffic continuity", () => {\n  it("moves only the remaining allowance while preserving already-consumed traffic", () => {\n    const transfer = migrationTransferShape(100n * GB, 37n * GB, 0n);\n    expect(transfer.usageOffsetBytes).toBe(37n * GB);\n    expect(transfer.remoteDataLimitBytes).toBe(63n * GB);\n    expect(transfer.usageOffsetBytes + transfer.remoteDataLimitBytes).toBe(100n * GB);\n  });\n\n  it("accounts for an existing unbound user counter on the new provider", () => {\n    const transfer = migrationTransferShape(100n * GB, 37n * GB, 5n * GB);\n    expect(transfer.usageOffsetBytes).toBe(32n * GB);\n    expect(transfer.remoteDataLimitBytes).toBe(68n * GB);\n    expect(transfer.usageOffsetBytes + 5n * GB).toBe(37n * GB);\n    expect(transfer.remoteDataLimitBytes - 5n * GB).toBe(63n * GB);\n  });\n\n  it("refuses an ambiguous remote counter instead of silently changing usage", () => {\n    expect(() => migrationTransferShape(100n * GB, 10n * GB, 12n * GB)).toThrow();\n  });\n});\n''')

          # Reuse the migration engine for the existing single-user action and quota updates.
          replace(
              "apps/control-plane/src/app/api/v1/admin/licenses/route.ts",
              'import { bindPasarGuardUser, syncPasarGuardBinding } from "@/lib/pasarguard/sync";\n',
              'import { migratePasarGuardBindingToActiveProvider } from "@/lib/pasarguard/migration";\nimport { bindPasarGuardUser, syncPasarGuardBinding } from "@/lib/pasarguard/sync";\n',
          )
          licenses = Path("apps/control-plane/src/app/api/v1/admin/licenses/route.ts")
          text = licenses.read_text()
          start = text.index('  if (input.data.action === "migrate_provider") {')
          end = text.index('\n  const update = input.data;', start)
          text = text[:start] + '''  if (input.data.action === "migrate_provider") {\n    try {\n      const result = await migratePasarGuardBindingToActiveProvider(before.pasarGuardBinding.id, {\n        profileKey: input.data.profileKey,\n      });\n      await db.auditLog.create({\n        data: {\n          actorId: admin.sub,\n          action: "managed_license.migrateProvider",\n          entityType: "Service",\n          entityId: before.id,\n          before: {\n            providerId: result.previousProviderId,\n            usedBytes: before.usedBytes.toString(),\n            quotaBytes: before.quotaBytes.toString(),\n          },\n          after: {\n            providerId: result.providerId,\n            externalUserId: String(result.externalUserId),\n            providerProfile: result.profileKey,\n            usageOffsetBytes: result.usageOffsetBytes.toString(),\n          },\n        },\n      });\n      return ok({\n        migrated: result.migrated,\n        alreadyActiveProvider: result.alreadyActiveProvider,\n        remainingBytes: "remainingBytes" in result && result.remainingBytes !== undefined\n          ? result.remainingBytes.toString()\n          : undefined,\n      });\n    } catch (error) {\n      return providerFailure(error);\n    }\n  }\n''' + text[end:]
          licenses.write_text(text)
          replace(
              "apps/control-plane/src/app/api/v1/admin/licenses/route.ts",
              '      select: { providerId: true },\n',
              '      select: { providerId: true, usageOffsetBytes: true },\n',
          )
          replace(
              "apps/control-plane/src/app/api/v1/admin/licenses/route.ts",
              '''    remoteBefore = await client.getUser(Number(before.pasarGuardBinding.externalUserId));\n    if (quotaBytes < remoteBefore.usedTraffic) {\n      return fail(400, "quota_below_usage", "حجم کل نمی‌تواند کمتر از مصرف فعلی کاربر باشد");\n    }\n    await client.updateUser(before.pasarGuardBinding.externalUsername, {\n      dataLimit: quotaBytes,\n''',
              '''    remoteBefore = await client.getUser(Number(before.pasarGuardBinding.externalUserId));\n    const effectiveUsedBytes = currentBinding.usageOffsetBytes + remoteBefore.usedTraffic;\n    if (quotaBytes < effectiveUsedBytes) {\n      return fail(400, "quota_below_usage", "حجم کل نمی‌تواند کمتر از مصرف فعلی کاربر باشد");\n    }\n    const remoteQuotaBytes = quotaBytes - currentBinding.usageOffsetBytes;\n    if (remoteQuotaBytes <= 0n) {\n      return fail(400, "quota_below_usage", "حجم جدید برای سابقه مصرف این کاربر کافی نیست");\n    }\n    await client.updateUser(before.pasarGuardBinding.externalUsername, {\n      dataLimit: remoteQuotaBytes,\n''',
          )

          # Admin integration API: safe batched migration, no need to select users one by one.
          replace(
              "apps/control-plane/src/app/api/v1/admin/integrations/pasarguard/route.ts",
              'import { bindPasarGuardUser, syncPasarGuardBinding } from "@/lib/pasarguard/sync";\n',
              'import { migratePasarGuardBindingToActiveProvider } from "@/lib/pasarguard/migration";\nimport { bindPasarGuardUser, syncPasarGuardBinding } from "@/lib/pasarguard/sync";\n',
          )
          replace(
              "apps/control-plane/src/app/api/v1/admin/integrations/pasarguard/route.ts",
              '''  z.object({\n    action: z.literal("map_plan"),\n    planId: z.string().min(1),\n    profileKey: z.string().regex(/^(template|group):[1-9]\\d*$/),\n  }),\n]);\n''',
              '''  z.object({\n    action: z.literal("map_plan"),\n    planId: z.string().min(1),\n    profileKey: z.string().regex(/^(template|group):[1-9]\\d*$/),\n  }),\n  z.object({\n    action: z.literal("migrate_batch"),\n    limit: z.number().int().min(1).max(50).default(20),\n    excludeBindingIds: z.array(z.string().min(1)).max(1000).default([]),\n  }),\n]);\n''',
          )
          route = Path("apps/control-plane/src/app/api/v1/admin/integrations/pasarguard/route.ts")
          route_text = route.read_text()
          insert_at = route_text.index('    if (input.data.action === "bind") {')
          batch = '''    if (input.data.action === "migrate_batch") {\n      const client = await createPasarGuardClient();\n      if (!client.providerId) return fail(503, "pasarguard_not_configured", "Provider فعال شناسه معتبر ندارد");\n      const mappings = await db.pasarGuardPlanMapping.findMany({\n        where: { providerId: client.providerId, valid: true },\n        select: { planId: true },\n      });\n      const mappedPlanIds = [...new Set(mappings.map((mapping) => mapping.planId))];\n      if (!mappedPlanIds.length) {\n        return fail(409, "plan_mapping_required", "ابتدا گروه پنل فعال را برای پلن‌های NimHUB مشخص کنید");\n      }\n      const excluded = [...new Set(input.data.excludeBindingIds)];\n      const baseWhere = {\n        OR: [{ providerId: null }, { providerId: { not: client.providerId } }],\n        service: {\n          planId: { in: mappedPlanIds },\n          status: { in: ["ACTIVE", "SUSPENDED"] as const },\n          expiresAt: { gt: new Date() },\n        },\n      };\n      const candidates = await db.pasarGuardBinding.findMany({\n        where: { ...baseWhere, ...(excluded.length ? { id: { notIn: excluded } } : {}) },\n        orderBy: { createdAt: "asc" },\n        take: input.data.limit,\n        select: { id: true },\n      });\n      const visibleUsers = await client.listUsers();\n      const migratedIds: string[] = [];\n      const failed: Array<{ bindingId: string; message: string }> = [];\n      for (const candidate of candidates) {\n        try {\n          const result = await migratePasarGuardBindingToActiveProvider(candidate.id, { client, visibleUsers });\n          migratedIds.push(candidate.id);\n          if (result.remoteUser) {\n            const index = visibleUsers.findIndex((user) => user.id === result.remoteUser!.id);\n            if (index >= 0) visibleUsers[index] = result.remoteUser;\n            else visibleUsers.push(result.remoteUser);\n          }\n        } catch (error) {\n          failed.push({\n            bindingId: candidate.id,\n            message: error instanceof PasarGuardError ? error.message : "انتقال این سرویس انجام نشد",\n          });\n        }\n      }\n      const skippedNow = [...new Set([...excluded, ...candidates.map((candidate) => candidate.id)])];\n      const remainingEligible = await db.pasarGuardBinding.count({\n        where: { ...baseWhere, ...(skippedNow.length ? { id: { notIn: skippedNow } } : {}) },\n      });\n      await db.auditLog.create({\n        data: {\n          actorId: admin.sub,\n          action: "pasarguard.migrateBatch",\n          entityType: "PasarGuardProvider",\n          entityId: client.providerId,\n          after: {\n            processed: candidates.length,\n            migrated: migratedIds.length,\n            failed: failed.length,\n            remainingEligible,\n          },\n        },\n      });\n      return ok({\n        processed: candidates.length,\n        migratedCount: migratedIds.length,\n        migratedIds,\n        failed,\n        remainingEligible,\n        hasMoreEligible: remainingEligible > 0,\n      });\n    }\n\n'''
          route.write_text(route_text[:insert_at] + batch + route_text[insert_at:])

          # Simplified admin page: only panel, plan routing and bulk migration are primary.
          Path("apps/control-plane/src/app/admin/integrations/pasarguard/page.tsx").write_text('''import {\n  PasarGuardIntegrationForm,\n  PasarGuardPlanMappingForm,\n  PasarGuardProviderForm,\n  PasarGuardSyncButton,\n} from "@/components/EntityForms";\nimport { PasarGuardMigrationPanel } from "@/components/PasarGuardMigrationPanel";\nimport { db } from "@/lib/db";\nimport { formatBytes, formatDate } from "@/lib/format";\nimport {\n  activePasarGuardProviderSummary,\n  isPasarGuardConfigured,\n  syncActivePasarGuardProfiles,\n} from "@/lib/pasarguard/provider";\n\nexport const dynamic = "force-dynamic";\n\ntype PlanLabelInput = {\n  name: string;\n  dataLimitBytes: bigint;\n  durationDays: number;\n  maxDevices: number;\n};\n\nfunction planLabel(plan: PlanLabelInput): string {\n  const details = `${formatBytes(plan.dataLimitBytes)} • ${plan.durationDays} روز • ${plan.maxDevices} دستگاه`;\n  return plan.name.startsWith("NimHUB Managed ") ? details : `${plan.name} — ${details}`;\n}\n\nexport default async function PasarGuardPage() {\n  const configured = await isPasarGuardConfigured();\n  const activeProvider = configured ? await activePasarGuardProviderSummary() : null;\n  const [users, bindings, plans, mappings] = await Promise.all([\n    db.user.findMany({\n      where: { status: "ACTIVE" },\n      orderBy: { email: "asc" },\n      select: { id: true, email: true },\n    }),\n    db.pasarGuardBinding.findMany({\n      orderBy: { createdAt: "desc" },\n      include: {\n        provider: { select: { id: true, name: true, baseUrl: true, active: true } },\n        service: {\n          include: {\n            user: { select: { email: true } },\n            plan: { select: { id: true, name: true, dataLimitBytes: true, durationDays: true, maxDevices: true } },\n          },\n        },\n        nodes: { select: { id: true, name: true, status: true } },\n      },\n    }),\n    db.plan.findMany({\n      where: { isActive: true },\n      orderBy: { name: "asc" },\n      select: { id: true, name: true, dataLimitBytes: true, durationDays: true, maxDevices: true },\n    }),\n    db.pasarGuardPlanMapping.findMany({\n      orderBy: { updatedAt: "desc" },\n      include: {\n        provider: { select: { id: true, name: true, active: true } },\n        plan: { select: { id: true, name: true, dataLimitBytes: true, durationDays: true, maxDevices: true } },\n      },\n    }),\n  ]);\n\n  let profiles: Array<{ key: string; name: string; kind: "template" | "group" }> = [];\n  let profileError = "";\n  if (configured) {\n    try {\n      profiles = (await syncActivePasarGuardProfiles()).profiles.map((profile) => ({\n        key: profile.key,\n        name: profile.name,\n        kind: profile.kind,\n      }));\n    } catch (error) {\n      profileError = error instanceof Error ? error.message : "دریافت گروه‌ها و قالب‌ها انجام نشد";\n    }\n  }\n\n  const activeMappings = activeProvider\n    ? mappings.filter((mapping) => mapping.providerId === activeProvider.id)\n    : [];\n  const mappedPlanIds = new Set(activeMappings.filter((mapping) => mapping.valid).map((mapping) => mapping.planId));\n  const now = Date.now();\n  const pendingBindings = activeProvider\n    ? bindings.filter((binding) =>\n        binding.providerId !== activeProvider.id\n        && ["ACTIVE", "SUSPENDED"].includes(binding.service.status)\n        && binding.service.expiresAt.getTime() > now,\n      )\n    : [];\n  const readyBindings = pendingBindings.filter((binding) =>\n    mappedPlanIds.has(binding.service.planId) && binding.service.usedBytes < binding.service.quotaBytes,\n  );\n  const blockedBindings = pendingBindings.filter((binding) => !readyBindings.includes(binding));\n\n  return (\n    <>\n      <header className="page-header">\n        <div>\n          <h1>مدیریت پنل VPN</h1>\n          <p>تعویض پنل، انتخاب گروه پلن‌ها و انتقال خودکار کاربران</p>\n        </div>\n        <span className={configured && activeProvider ? "badge green" : "badge red"}>\n          {configured && activeProvider ? "پنل فعال متصل است" : "نیازمند تنظیم اتصال"}\n        </span>\n      </header>\n\n      <section className="card section">\n        <div className="section-title"><h2>پنل فعال</h2></div>\n        {activeProvider ? (\n          <div style={{ marginBottom: 16, color: "var(--muted)" }}>\n            <strong style={{ color: "var(--text)" }}>{activeProvider.name}</strong><br />\n            <span dir="ltr">{activeProvider.baseUrl}</span><br />\n            آخرین تست: {formatDate(activeProvider.lastTestAt)} — آخرین Sync: {formatDate(activeProvider.lastSyncAt)}\n            {activeProvider.lastError ? <><br /><span className="error">{activeProvider.lastError}</span></> : null}\n          </div>\n        ) : <div className="empty" style={{ marginBottom: 16 }}>هنوز پنل فعالی ثبت نشده است.</div>}\n        <PasarGuardProviderForm\n          configured={configured}\n          baseUrl={activeProvider?.baseUrl ?? ""}\n          username={activeProvider?.username ?? ""}\n        />\n        {profileError ? <p className="error">{profileError}</p> : null}\n      </section>\n\n      <section className="card section">\n        <div className="section-title"><h2>پلن‌های پنل فعال</h2></div>\n        <p style={{ color: "var(--muted)", marginTop: 0 }}>\n          فقط یک‌بار مشخص کن هر پلن NimHUB در پنل فعال داخل کدام گروه یا قالب ساخته شود.\n        </p>\n        <PasarGuardPlanMappingForm\n          plans={plans.map((plan) => ({ id: plan.id, label: planLabel(plan) }))}\n          profiles={profiles}\n        />\n        {activeMappings.length ? (\n          <div className="table-wrap" style={{ marginTop: 18 }}><table>\n            <thead><tr><th>پلن</th><th>گروه / قالب پنل فعال</th><th>وضعیت</th></tr></thead>\n            <tbody>{activeMappings.map((mapping) => <tr key={mapping.id}>\n              <td>{planLabel(mapping.plan)}</td>\n              <td>{mapping.profileName}</td>\n              <td><span className={mapping.valid ? "badge green" : "badge red"}>{mapping.valid ? "آماده" : "نیازمند انتخاب دوباره"}</span></td>\n            </tr>)}</tbody>\n          </table></div>\n        ) : <div className="empty" style={{ marginTop: 16 }}>هنوز برای پنل فعال، گروهی به پلن‌ها اختصاص داده نشده است.</div>}\n      </section>\n\n      <PasarGuardMigrationPanel\n        pendingCount={pendingBindings.length}\n        readyCount={readyBindings.length}\n        blockedCount={blockedBindings.length}\n      />\n\n      <details className="card section">\n        <summary style={{ cursor: "pointer", fontWeight: 700, fontSize: 18 }}>تنظیمات پیشرفته و عیب‌یابی</summary>\n        <p style={{ color: "var(--muted)" }}>\n          این بخش برای اتصال دستی یا بررسی فنی است و برای انتقال عادی کاربران لازم نیست.\n        </p>\n        <div style={{ marginTop: 20 }}>\n          <h3>اتصال دستی یک کاربر</h3>\n          <PasarGuardIntegrationForm configured={configured} quickPingUsers={users.map((user) => ({ id: user.id, label: user.email }))} />\n        </div>\n        <div style={{ marginTop: 28 }}>\n          <h3>وضعیت فنی سرویس‌ها</h3>\n          {bindings.length ? (\n            <div className="table-wrap"><table>\n              <thead><tr><th>حساب NimHUB</th><th>پلن</th><th>وضعیت پنل</th><th>مصرف</th><th>سرورها</th><th>کنترل</th></tr></thead>\n              <tbody>{bindings.map((binding) => {\n                const needsMigration = Boolean(activeProvider && binding.providerId !== activeProvider.id);\n                return <tr key={binding.id}>\n                  <td dir="ltr">{binding.service.user.email}</td>\n                  <td>{planLabel(binding.service.plan)}</td>\n                  <td>{needsMigration ? <span className="badge red">در حال بررسی</span> : <span className="badge green">تأیید شده</span>}</td>\n                  <td>{formatBytes(binding.service.usedBytes)} / {formatBytes(binding.service.quotaBytes)}</td>\n                  <td><span className="badge blue">{needsMigration ? 0 : binding.nodes.length} سرور</span></td>\n                  <td><PasarGuardSyncButton bindingId={binding.id} /></td>\n                </tr>;\n              })}</tbody>\n            </table></div>\n          ) : <div className="empty">سرویسی متصل نشده است.</div>}\n        </div>\n      </details>\n    </>\n  );\n}\n''')

          Path("apps/control-plane/src/components/PasarGuardMigrationPanel.tsx").write_text('''"use client";\n\nimport { useState } from "react";\nimport { useRouter } from "next/navigation";\n\ntype BatchResponse = {\n  data?: {\n    processed?: number;\n    migratedCount?: number;\n    failed?: Array<{ bindingId: string; message: string }>;\n    hasMoreEligible?: boolean;\n  };\n  error?: { message?: string };\n};\n\nexport function PasarGuardMigrationPanel({\n  pendingCount,\n  readyCount,\n  blockedCount,\n}: {\n  pendingCount: number;\n  readyCount: number;\n  blockedCount: number;\n}) {\n  const router = useRouter();\n  const [busy, setBusy] = useState(false);\n  const [message, setMessage] = useState("");\n  const [error, setError] = useState("");\n\n  async function migrateAll() {\n    setBusy(true);\n    setError("");\n    setMessage("شروع انتقال امن کاربران آماده…");\n    const failedIds = new Set<string>();\n    let migratedTotal = 0;\n    let failedTotal = 0;\n    try {\n      for (let batch = 0; batch < 100; batch += 1) {\n        const response = await fetch("/api/v1/admin/integrations/pasarguard", {\n          method: "POST",\n          headers: { "content-type": "application/json" },\n          body: JSON.stringify({\n            action: "migrate_batch",\n            limit: 20,\n            excludeBindingIds: [...failedIds],\n          }),\n        });\n        const body = await response.json().catch(() => null) as BatchResponse | null;\n        if (!response.ok) throw new Error(body?.error?.message ?? "انتقال گروهی انجام نشد");\n        const migrated = body?.data?.migratedCount ?? 0;\n        const failures = body?.data?.failed ?? [];\n        migratedTotal += migrated;\n        failedTotal += failures.length;\n        failures.forEach((failure) => failedIds.add(failure.bindingId));\n        setMessage(`انتقال: ${migratedTotal} موفق${failedTotal ? ` — ${failedTotal} نیازمند بررسی` : ""}`);\n        if (!body?.data?.hasMoreEligible || (body.data.processed ?? 0) === 0) break;\n      }\n      if (failedTotal) {\n        setError(`${failedTotal} سرویس به دلیل وضعیت خاص نیازمند بررسی دستی است؛ بقیه کاربران منتقل شدند.`);\n      }\n      router.refresh();\n    } catch (cause) {\n      setError(cause instanceof Error ? cause.message : "انتقال گروهی متوقف شد");\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  return (\n    <section className="card section">\n      <div className="section-title"><h2>انتقال کاربران پنل قبلی</h2></div>\n      <p style={{ color: "var(--muted)", marginTop: 0 }}>\n        این شمارش پیش‌نمایش است و چیزی را تغییر نمی‌دهد. هنگام انتقال، مصرف قبلی، حجم باقی‌مانده، تاریخ انقضا و تعداد دستگاه حفظ می‌شود.\n      </p>\n      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", margin: "16px 0" }}>\n        <span className="badge blue">{pendingCount} نیازمند انتقال</span>\n        <span className="badge green">{readyCount} آماده انتقال</span>\n        <span className={blockedCount ? "badge red" : "badge green"}>{blockedCount} نیازمند بررسی</span>\n      </div>\n      <p style={{ color: "var(--muted)", fontSize: 13 }}>\n        تا وقتی انتقال یک سرویس تأیید نشده، اپ هیچ سروری از پنل قبلی به آن کاربر نمی‌دهد و وضعیت سرویس «در حال بررسی» است. بعد از انتقال موفق، سرورهای پنل جدید خودکار Sync می‌شوند.\n      </p>\n      {message ? <p style={{ color: "var(--success)", fontSize: 13 }}>{message}</p> : null}\n      {error ? <p className="error">{error}</p> : null}\n      <button className="button" type="button" disabled={busy || readyCount === 0} onClick={migrateAll}>\n        {busy ? "در حال انتقال گروهی…" : `انتقال همه ${readyCount} کاربر آماده`}\n      </button>\n    </section>\n  );\n}\n''')


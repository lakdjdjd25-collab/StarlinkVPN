name: Apply NimHUB UI patches

on:
  push:
    branches: ["feat/nimhub-2.6.10-login-account-license"]
    paths: [".github/workflows/apply-nimhub-ui-patches.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical UI fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # Account sheet: never stop at the Material3 partial anchor and keep
          # actions reachable while the keyboard is open.
          p = Path("apps/android/src/main/java/org/quickping/app/ui/screens/AccountScreen.kt")
          s = p.read_text()
          s = replace_once(s,
              "import androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.padding",
              "import androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.imePadding\nimport androidx.compose.foundation.layout.navigationBarsPadding\nimport androidx.compose.foundation.layout.padding",
              "account layout imports")
          s = replace_once(s,
              "import androidx.compose.material3.OutlinedTextFieldDefaults\nimport androidx.compose.material3.Text",
              "import androidx.compose.material3.OutlinedTextFieldDefaults\nimport androidx.compose.material3.rememberModalBottomSheetState\nimport androidx.compose.material3.Text",
              "account sheet state import")
          s = replace_once(s,
              "    var deletionPassword by remember { mutableStateOf(\"\") }\n\n    QuickPingScreen {",
              "    var deletionPassword by remember { mutableStateOf(\"\") }\n    val passwordSheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true)\n\n    QuickPingScreen {",
              "account sheet state")
          s = replace_once(s,
              "        ModalBottomSheet(\n            onDismissRequest = {\n                if (!busy) {\n                    showPasswordSheet = false\n                    onClearAction()\n                }\n            },\n            dragHandle = null,",
              "        ModalBottomSheet(\n            onDismissRequest = {\n                if (!busy) {\n                    showPasswordSheet = false\n                    onClearAction()\n                }\n            },\n            sheetState = passwordSheetState,\n            dragHandle = null,",
              "password sheet state binding")
          s = replace_once(s,
              "            Column(Modifier.fillMaxWidth().padding(horizontal = 20.dp)) {\n                OutlinedTextField(\n                    value = currentPassword,",
              "            Column(\n                Modifier\n                    .fillMaxWidth()\n                    .verticalScroll(rememberScrollState())\n                    .imePadding()\n                    .navigationBarsPadding()\n                    .padding(horizontal = 20.dp),\n            ) {\n                OutlinedTextField(\n                    value = currentPassword,",
              "password sheet keyboard safe body")
          p.write_text(s)

          # Login screen: fixed-width blinking cursor, no OTP entry path,
          # explicit QR module availability/install, stricter QR parser and
          # localized errors.
          p = Path("apps/android/src/main/java/org/quickping/app/ui/screens/ReferenceLoginScreen.kt")
          s = p.read_text()
          s = replace_once(s,
              "import com.google.android.gms.mlkit.codescanner.GmsBarcodeScanning",
              "import com.google.android.gms.common.moduleinstall.InstallStatusListener\nimport com.google.android.gms.common.moduleinstall.ModuleInstall\nimport com.google.android.gms.common.moduleinstall.ModuleInstallRequest\nimport com.google.android.gms.common.moduleinstall.ModuleInstallStatusUpdate\nimport com.google.android.gms.common.moduleinstall.ModuleInstallStatusUpdate.InstallState.STATE_CANCELED\nimport com.google.android.gms.common.moduleinstall.ModuleInstallStatusUpdate.InstallState.STATE_COMPLETED\nimport com.google.android.gms.common.moduleinstall.ModuleInstallStatusUpdate.InstallState.STATE_FAILED\nimport com.google.android.gms.mlkit.codescanner.GmsBarcodeScanning",
              "QR module imports")
          s = replace_once(s,
              "import org.quickping.app.model.AppLanguage",
              "import org.json.JSONObject\nimport org.quickping.app.model.AppLanguage",
              "JSON import")
          s = replace_once(s,
              "    var password by remember { mutableStateOf(\"\") }\n    var verificationCode by remember { mutableStateOf(\"\") }",
              "    var password by remember { mutableStateOf(\"\") }\n    var scannerPreparing by remember { mutableStateOf(false) }",
              "login local state")
          s = replace_once(s,
              "\n    LaunchedEffect(debugCode) {\n        if (!debugCode.isNullOrBlank()) verificationCode = debugCode\n    }\n",
              "\n",
              "remove OTP debug code state")
          old_welcome = '''            Text(\n                text = buildAnnotatedString {\n                    append(typedWelcome)\n                    withStyle(SpanStyle(color = Color(0xFF4A82FF), fontWeight = FontWeight.Normal)) {\n                        append(if (cursorVisible) \"│\" else \" \")\n                    }\n                },\n                color = Color(0xFFD1D4DB),\n                fontFamily = Peyda,\n                fontSize = if (keyboardVisible) 16.sp else 18.sp,\n                fontWeight = FontWeight.SemiBold,\n                maxLines = 1,\n            )'''
          new_welcome = '''            Row(verticalAlignment = Alignment.CenterVertically) {\n                Text(\n                    text = typedWelcome,\n                    color = Color(0xFFD1D4DB),\n                    fontFamily = Peyda,\n                    fontSize = if (keyboardVisible) 16.sp else 18.sp,\n                    fontWeight = FontWeight.SemiBold,\n                    maxLines = 1,\n                )\n                Text(\n                    text = \"│\",\n                    color = Color(0xFF4A82FF).copy(alpha = if (cursorVisible) 1f else 0f),\n                    fontFamily = Peyda,\n                    fontSize = if (keyboardVisible) 16.sp else 18.sp,\n                    fontWeight = FontWeight.Normal,\n                    maxLines = 1,\n                )\n            }'''
          s = replace_once(s, old_welcome, new_welcome, "stable welcome cursor")

          s = replace_once(s,
              "    val scanner = remember(context, scannerOptions) { GmsBarcodeScanning.getClient(context, scannerOptions) }\n\n    Box(",
              '''    val scanner = remember(context, scannerOptions) { GmsBarcodeScanning.getClient(context, scannerOptions) }\n    val moduleInstallClient = remember(context) { ModuleInstall.getClient(context) }\n    val qrNotFoundText = quickText(\"کد مجوز در QR پیدا نشد\", \"License code was not found in the QR\")\n    val qrFailedText = quickText(\"اسکن QR انجام نشد\", \"QR scan failed\")\n    val qrPreparingText = quickText(\"در حال آماده‌سازی اسکنر QR…\", \"Preparing QR scanner…\")\n\n    fun launchQrScanner() {\n        scanner.startScan()\n            .addOnSuccessListener { barcode ->\n                val parsed = referenceExtractLicense(barcode.rawValue.orEmpty())\n                if (parsed.isNotBlank()) {\n                    license = parsed\n                    scanError = null\n                } else {\n                    scanError = qrNotFoundText\n                }\n            }\n            .addOnCanceledListener { scanError = null }\n            .addOnFailureListener { scanError = qrFailedText }\n    }\n\n    fun prepareAndLaunchQrScanner() {\n        if (scannerPreparing) return\n        scanError = null\n        moduleInstallClient.areModulesAvailable(scanner)\n            .addOnSuccessListener { availability ->\n                if (availability.areModulesAvailable()) {\n                    launchQrScanner()\n                } else {\n                    scannerPreparing = true\n                    scanError = qrPreparingText\n                    lateinit var listener: InstallStatusListener\n                    listener = InstallStatusListener { update: ModuleInstallStatusUpdate ->\n                        when (update.installState) {\n                            STATE_COMPLETED -> {\n                                scannerPreparing = false\n                                scanError = null\n                                moduleInstallClient.unregisterListener(listener)\n                                launchQrScanner()\n                            }\n                            STATE_CANCELED, STATE_FAILED -> {\n                                scannerPreparing = false\n                                scanError = qrFailedText\n                                moduleInstallClient.unregisterListener(listener)\n                            }\n                        }\n                    }\n                    val request = ModuleInstallRequest.newBuilder()\n                        .addApi(scanner)\n                        .setListener(listener)\n                        .build()\n                    moduleInstallClient.installModules(request)\n                        .addOnSuccessListener { response ->\n                            if (response.areModulesAlreadyInstalled()) {\n                                scannerPreparing = false\n                                scanError = null\n                                launchQrScanner()\n                            }\n                        }\n                        .addOnFailureListener {\n                            scannerPreparing = false\n                            scanError = qrFailedText\n                            moduleInstallClient.unregisterListener(listener)\n                        }\n                }\n            }\n            .addOnFailureListener { scanError = qrFailedText }\n    }\n\n    LaunchedEffect(scanner) {\n        moduleInstallClient.deferredInstall(scanner)\n    }\n\n    Box(''',
              "QR module installer")

          old_scan = '''                onScan = {\n                    scanner.startScan()\n                        .addOnSuccessListener { barcode ->\n                            val parsed = referenceExtractLicense(barcode.rawValue.orEmpty())\n                            if (parsed.isNotBlank()) {\n                                license = parsed\n                                scanError = null\n                            } else {\n                                scanError = \"کد مجوز در QR پیدا نشد\"\n                            }\n                        }\n                        .addOnCanceledListener { scanError = null }\n                        .addOnFailureListener { scanError = \"اسکن QR انجام نشد\" }\n                },'''
          s = replace_once(s, old_scan, "                onScan = { prepareAndLaunchQrScanner() },", "QR click")
          s = replace_once(s,
              "                        onPasswordLogin(value, value)",
              "                        onPasswordLogin(value, \"\")",
              "license login password")

          otp_button = '''                    TextButton(\n                        onClick = {\n                            if (email.contains(\"@\")) {\n                                showEmailDialog = false\n                                onRequestEmailCode(email)\n                            }\n                        },\n                        enabled = email.contains(\"@\") && !busy,\n                    ) {\n                        Text(quickText(\"ورود با کد ایمیل\", \"Sign in with email code\"), color = QuickPingColors.TextSecondary)\n                    }\n'''
          s = replace_once(s, otp_button, "", "remove email OTP button")
          s = replace_once(s,
              "            val visibleError = scanError ?: error?.takeIf { challengeId == null }",
              "            val visibleError = scanError ?: error",
              "login error visibility")
          s = replace_once(s,
              "                    visibleError,",
              "                    referenceLocalizedLoginError(visibleError),",
              "localized login errors")

          # Remove the email-code challenge dialog entirely. Password/email and
          # license/Google are now the only login paths on this screen.
          start = s.find("    } else if (challengeId != null) {")
          if start < 0:
              raise SystemExit("email OTP challenge block not found")
          end_marker = "\n    }\n}\n\n@Composable\nprivate fun ReferenceLicenseBar"
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit("email OTP challenge end not found")
          s = s[:start] + "    }\n}\n\n@Composable\nprivate fun ReferenceLicenseBar" + s[end + len(end_marker):]

          # Replace permissive parser with a strict license-aware parser that
          # supports plain codes, NimHUB URLs and JSON QR payloads.
          parser_start = s.find("private fun referenceExtractLicense(raw: String): String {")
          if parser_start < 0:
              raise SystemExit("license parser start not found")
          parser = '''internal fun referenceExtractLicense(raw: String): String {\n    val value = raw.trim()\n    if (value.isBlank()) return \"\"\n\n    if (value.startsWith(\"{\")) {\n        runCatching { JSONObject(value) }.getOrNull()?.let { json ->\n            listOf(\"license\", \"code\", \"key\")\n                .firstNotNullOfOrNull { key -> json.optString(key).takeIf(String::isNotBlank) }\n                ?.let(::normalizeReferenceLicense)\n                ?.takeIf(String::isNotBlank)\n                ?.let { return it }\n        }\n    }\n\n    val prefixed = value.replace(Regex(\"^(?i)(NIMHUB|LICENSE|LICENCE)\\\\s*[:=]\\\\s*\"), \"\")\n    normalizeReferenceLicense(prefixed).takeIf(String::isNotBlank)?.let { return it }\n\n    if (!value.contains(\"://\")) return \"\"\n    return runCatching {\n        val uri = Uri.parse(value)\n        val candidate = listOf(\"license\", \"code\", \"key\")\n            .firstNotNullOfOrNull { uri.getQueryParameter(it)?.trim()?.takeIf(String::isNotBlank) }\n            ?: uri.lastPathSegment?.trim().orEmpty()\n        normalizeReferenceLicense(candidate)\n    }.getOrDefault(\"\")\n}\n\nprivate fun normalizeReferenceLicense(value: String): String {\n    val candidate = value.trim().uppercase()\n    return candidate.takeIf { it.matches(Regex(\"[A-Z0-9_-]{6,64}\")) }.orEmpty()\n}\n\n@Composable\nprivate fun referenceLocalizedLoginError(message: String): String = when {\n    message.contains(\"Email or password is incorrect\", ignoreCase = true) ->\n        quickText(\"ایمیل یا رمز عبور صحیح نیست\", \"Email or password is incorrect\")\n    message.contains(\"License is invalid or inactive\", ignoreCase = true) ->\n        quickText(\"مجوز معتبر یا فعال نیست\", \"License is invalid or inactive\")\n    message.contains(\"Google sign-in was cancelled\", ignoreCase = true) ->\n        quickText(\"ورود با گوگل لغو شد\", \"Google sign-in was cancelled\")\n    message.contains(\"No available Google account\", ignoreCase = true) ->\n        quickText(\"حساب گوگل قابل استفاده‌ای روی دستگاه پیدا نشد\", \"No available Google account was found on this device\")\n    message.contains(\"Google sign-in could not be opened\", ignoreCase = true) ->\n        quickText(\"ورود با گوگل باز نشد\", \"Google sign-in could not be opened\")\n    message.contains(\"ورود گوگل\") || message.contains(\"Google\", ignoreCase = true) ->\n        quickText(\"ورود با گوگل کامل نشد\", \"Google sign-in could not be completed\")\n    else -> message\n}\n'''
          s = s[:parser_start] + parser
          p.write_text(s)
          PY

      - name: Commit patches
        run: |
          git config user.name "lakdjdjd25-collab"
          git config user.email "lakdjdjd25@gmail.com"
          git add apps/android/src/main/java/org/quickping/app/ui/screens/AccountScreen.kt \
                  apps/android/src/main/java/org/quickping/app/ui/screens/ReferenceLoginScreen.kt
          git diff --cached --check
          git commit -m "fix(android): repair account sheet and login interactions"
          git push origin HEAD:feat/nimhub-2.6.10-login-account-license

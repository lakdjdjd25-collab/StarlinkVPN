name: Deploy PasarGuard compatibility production

on:
  push:
    branches: ["agent/managed-accounts-production-e2e"]
    paths: [".github/workflows/managed-accounts-production-e2e.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact production source
        uses: actions/checkout@v4
        with:
          ref: 4af851fd74447086089279aa7d7dc8f821915529
          path: production
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Start Railway device authentication
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/railway-auth-public.pem
          openssl pkey -pubin -in /tmp/railway-auth-public.pem -noout
          : > /tmp/railway-login.log
          RUNNER_TRACKING_ID="" nohup railway login --browserless > /tmp/railway-login.log 2>&1 &
          echo $! > /tmp/railway-login.pid
          for i in $(seq 1 45); do
            if grep -Eq 'https?://|code|Code|pair|Pair|sign in|Sign in' /tmp/railway-login.log; then break; fi
            PID=$(cat /tmp/railway-login.pid)
            if ! kill -0 "$PID" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          tail -c 400 /tmp/railway-login.log > /tmp/railway-login-prompt.txt
          test -s /tmp/railway-login-prompt.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/railway-auth-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/railway-login-prompt.txt -out /tmp/railway-login-prompt.bin
          base64 -w0 /tmp/railway-login-prompt.bin > /tmp/railway-login-prompt.b64
      - name: Upload encrypted Railway device prompt
        uses: actions/upload-artifact@v4
        with:
          name: railway-device-prompt-pasarguard-compat
          path: /tmp/railway-login-prompt.b64
          if-no-files-found: error
          retention-days: 1
      - name: Wait for Railway authentication
        shell: bash
        run: |
          set -euo pipefail
          PID=$(cat /tmp/railway-login.pid)
          for i in $(seq 1 300); do
            if ! kill -0 "$PID" 2>/dev/null; then railway whoami --json >/dev/null; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Link production service
        working-directory: production
        run: railway link --project d2b3a600-5b04-4ba9-a341-7959ab38e187 --environment production --service control-plane
      - name: Deploy exact main source
        working-directory: production
        run: railway up --service control-plane --environment production --detach -m "Deploy PasarGuard compatibility 4af851fd74447086089279aa7d7dc8f821915529"
      - name: Verify production deployment
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            STATUS=$(railway deployment list --service control-plane --environment production --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const d=Array.isArray(x)?x[0]:x.deployments?.[0];console.log(d?.status||"")})')
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|SKIPPED|REMOVED) exit 1 ;;
            esac
            sleep 5
          done
          exit 1
      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://control-plane-production-a517.up.railway.app'
          HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/v1/health")
          PASARGUARD=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/admin/integrations/pasarguard")
          test "$HEALTH" = "200"
          test "$PASARGUARD" != "404"
          printf '{"health":true,"pasarGuardPage":true}' > /tmp/pasarguard-compat-smoke.json
      - name: Upload safe smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimhub-pasarguard-compat-production-smoke
          path: /tmp/pasarguard-compat-smoke.json
          if-no-files-found: warn
          retention-days: 7

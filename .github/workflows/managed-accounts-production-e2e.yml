name: NimHUB final production deploy

on:
  push:
    branches: ["agent/managed-accounts-production-e2e"]
    paths: [".github/workflows/managed-accounts-production-e2e.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact production source
        uses: actions/checkout@v4
        with:
          ref: 68780e32a0117b49489a29373d1affc50e1e800d
          path: production
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Start Railway device authentication
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/railway-auth-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA41IUAPmg992w55hWHaFh
          NN4LKu8VS02g5+Pa2wOXjMSD8GEflDJrfQWoRvMBjJbGtNFmX4snSuQd4F2TQMV0
          2AKYnKAknjXZRxYFFGjCbCOSIIFf/aEl28qTeKXkXVALDPzoz9mIql4NLBNlXzSF
          MIoH7Yb/ImSHOYRfejY1OcdfNbZbeTIYEaujE32FrL83ausGaHGwho1qvnlXutgZ
          4fj6yUh874goosGqXesw3wKF5KKD3dLTL/l7X+53R37lkTItWfb10YmlQVQfuXox
          KFEljKTUHFJq9RNWjiuna4AdqStYy6lQizqkXZgnBE6Lgl8F7K01b4Afolgta7U2
          UjOY1xNv46ZdaLqosu2BvdPoM5cR/dAWKUVSRVrUemyXp1CggEbvomNliNvokztp
          W3Ije7APOAgEMCOle5kmx+IIZebG/waKwH66HcUp8NrhT5zCjgDE3lPBrRqjJuxP
          SOW6gjdwFi1BSqJR4MzYeWQcCv8yXDz+Ehb5hqxgFgtis3GRE8do79mjqvtUeFZm
          txis1Pa4i3senVZD4JglWyZGaxYxjRbKKRQSHtuBEsgHQ8StaCO6KJd6iejZ/IF
          pFE3ab32MbR58hiZf8XQ27c/LZ1tbu3frpu5Kcnp28uQh3z1/0Prpsht678klpXK
          WOa9D90daJWpRd9NvICqumsCAwEAAQ==
          -----END PUBLIC KEY-----
          EOF
          : > /tmp/railway-login.log
          RUNNER_TRACKING_ID="" nohup railway login --browserless > /tmp/railway-login.log 2>&1 &
          echo $! > /tmp/railway-login.pid
          for i in $(seq 1 45); do
            if grep -Eq 'https?://|code|Code|pair|Pair|sign in|Sign in' /tmp/railway-login.log; then break; fi
            PID=$(cat /tmp/railway-login.pid)
            if ! kill -0 "$PID" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          tail -c 400 /tmp/railway-login.log > /tmp/railway-login-prompt.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/railway-auth-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/railway-login-prompt.txt -out /tmp/railway-login-prompt.bin
          base64 -w0 /tmp/railway-login-prompt.bin > /tmp/railway-login-prompt.b64
      - name: Upload encrypted Railway device prompt
        uses: actions/upload-artifact@v4
        with:
          name: railway-device-prompt-encrypted-2613
          path: /tmp/railway-login-prompt.b64
          if-no-files-found: error
          retention-days: 1
      - name: Wait for Railway authentication
        shell: bash
        run: |
          set -euo pipefail
          PID=$(cat /tmp/railway-login.pid)
          for i in $(seq 1 300); do
            if ! kill -0 "$PID" 2>/dev/null; then railway whoami --json >/dev/null; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Link production service
        working-directory: production
        run: railway link --project d2b3a600-5b04-4ba9-a341-7959ab38e187 --environment production --service control-plane
      - name: Deploy exact main source
        working-directory: production
        run: railway up --service control-plane --environment production --detach -m "Deploy NimHUB 2.6.13 68780e32a0117b49489a29373d1affc50e1e800d"
      - name: Verify production deployment
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            STATUS=$(railway deployment list --service control-plane --environment production --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const d=Array.isArray(x)?x[0]:x.deployments?.[0];console.log(d?.status||"")})')
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|SKIPPED|REMOVED) exit 1 ;;
            esac
            sleep 5
          done
          exit 1
      - name: Verify new production routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://control-plane-production-a517.up.railway.app'
          HEALTH=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE/api/v1/health")
          MANAGEMENT=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/v1/client/management")
          READ_ROUTE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$BASE/api/v1/client/notifications/test/read")
          ADMIN_PG=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/v1/admin/integrations/pasarguard")
          test "$HEALTH" = "200"
          test "$MANAGEMENT" != "404"
          test "$READ_ROUTE" != "404"
          test "$ADMIN_PG" != "404"
          printf '{"health":true,"managementRoute":true,"notificationReadRoute":true,"pasarGuardAdminRoute":true}' > /tmp/final-smoke.json
      - name: Safe PasarGuard connectivity probe
        shell: bash
        run: |
          set -euo pipefail
          railway run --project d2b3a600-5b04-4ba9-a341-7959ab38e187 --service control-plane --environment production --no-local node - <<'NODE'
          const baseValue = process.env.PASARGUARD_BASE_URL;
          const username = process.env.PASARGUARD_USERNAME;
          const password = process.env.PASARGUARD_PASSWORD;
          if (!baseValue || !username || !password) process.exit(10);
          const base = new URL(baseValue.endsWith('/') ? baseValue : `${baseValue}/`);
          const body = new URLSearchParams({grant_type:'password', username, password});
          const tokenResponse = await fetch(new URL('api/admin/token', base), {method:'POST', headers:{'content-type':'application/x-www-form-urlencoded'}, body});
          if (!tokenResponse.ok) process.exit(11);
          const tokenJson = await tokenResponse.json().catch(() => null);
          if (!tokenJson?.access_token) process.exit(12);
          const headers = {authorization:`Bearer ${tokenJson.access_token}`, accept:'application/json'};
          const groupResponse = await fetch(new URL('api/groups/simple?limit=100&offset=0', base), {headers});
          if (!groupResponse.ok) process.exit(13);
          const groupJson = await groupResponse.json().catch(() => null);
          const groupCount = Array.isArray(groupJson?.groups) ? groupJson.groups.length : -1;
          if (groupCount < 0) process.exit(14);
          const templateResponse = await fetch(new URL('api/user_templates', base), {headers});
          const templateReachable = templateResponse.ok || templateResponse.status === 403;
          if (!templateReachable) process.exit(15);
          console.log(JSON.stringify({pasarGuardAuth:true, groupsReadable:true, groupCount, templatesReachable:templateReachable}));
          NODE
      - name: Upload safe final smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimhub-2613-production-smoke
          path: /tmp/final-smoke.json
          if-no-files-found: warn
          retention-days: 7

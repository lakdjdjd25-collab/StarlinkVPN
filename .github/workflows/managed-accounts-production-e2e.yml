name: NimHUB final production verification

on:
  push:
    branches: ["agent/managed-accounts-production-e2e"]
    paths: [".github/workflows/managed-accounts-production-e2e.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact production source
        uses: actions/checkout@v4
        with:
          ref: 68780e32a0117b49489a29373d1affc50e1e800d
          path: production
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install project dependencies
        working-directory: production
        run: npm ci
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Start Railway device authentication
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/railway-auth-public.pem
          openssl pkey -pubin -in /tmp/railway-auth-public.pem -noout
          : > /tmp/railway-login.log
          RUNNER_TRACKING_ID="" nohup railway login --browserless > /tmp/railway-login.log 2>&1 &
          echo $! > /tmp/railway-login.pid
          for i in $(seq 1 45); do
            if grep -Eq 'https?://|code|Code|pair|Pair|sign in|Sign in' /tmp/railway-login.log; then break; fi
            PID=$(cat /tmp/railway-login.pid)
            if ! kill -0 "$PID" 2>/dev/null; then cat /tmp/railway-login.log; exit 1; fi
            sleep 1
          done
          tail -c 400 /tmp/railway-login.log > /tmp/railway-login-prompt.txt
          test -s /tmp/railway-login-prompt.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/railway-auth-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/railway-login-prompt.txt -out /tmp/railway-login-prompt.bin
          base64 -w0 /tmp/railway-login-prompt.bin > /tmp/railway-login-prompt.b64
      - name: Upload encrypted Railway device prompt
        uses: actions/upload-artifact@v4
        with:
          name: railway-device-prompt-encrypted-final-smoke
          path: /tmp/railway-login-prompt.b64
          if-no-files-found: error
          retention-days: 1
      - name: Wait for Railway authentication
        shell: bash
        run: |
          set -euo pipefail
          PID=$(cat /tmp/railway-login.pid)
          for i in $(seq 1 300); do
            if ! kill -0 "$PID" 2>/dev/null; then railway whoami --json >/dev/null; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Correct production route smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://control-plane-production-a517.up.railway.app'
          HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/v1/health")
          BOOTSTRAP=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/v1/client/bootstrap")
          NOTIFICATIONS=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH -H 'content-type: application/json' --data '{}' "$BASE/api/v1/client/notifications")
          ADMIN_PG=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/v1/admin/integrations/pasarguard")
          test "$HEALTH" = "200"
          test "$BOOTSTRAP" != "404"
          test "$NOTIFICATIONS" != "404"
          test "$ADMIN_PG" != "404"
          printf '{"health":true,"bootstrapRoute":true,"notificationReadRoute":true,"pasarGuardAdminRoute":true}' > /tmp/http-smoke.json
      - name: Safe active PasarGuard connectivity probe
        working-directory: production/apps/control-plane
        shell: bash
        run: |
          set -euo pipefail
          railway run --project d2b3a600-5b04-4ba9-a341-7959ab38e187 --service control-plane --environment production --no-local npx tsx -e '
            import { writeFileSync } from "node:fs";
            import { createPasarGuardClient, discoverPasarGuardProfiles } from "./src/lib/pasarguard/provider.ts";
            (async () => {
              const client = await createPasarGuardClient();
              const profiles = await discoverPasarGuardProfiles(client);
              if (!profiles.length) throw new Error("no_usable_profiles");
              await client.listUsers();
              const groupCount = profiles.filter((p) => p.kind === "group").length;
              const templateCount = profiles.filter((p) => p.kind === "template").length;
              writeFileSync("/tmp/pasarguard-smoke.json", JSON.stringify({pasarGuardAuth:true, profilesReadable:true, groupCount, templateCount, usersReadable:true}));
            })().catch((error) => { console.error(error instanceof Error ? error.message : "provider_smoke_failed"); process.exit(1); });
          '
      - name: Combine safe result
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const read = (p) => { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return {}; } };
          fs.writeFileSync('/tmp/final-smoke.json', JSON.stringify({...read('/tmp/http-smoke.json'), ...read('/tmp/pasarguard-smoke.json')}));
          NODE
      - name: Upload safe final smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimhub-2613-production-final-smoke
          path: /tmp/final-smoke.json
          if-no-files-found: error
          retention-days: 7

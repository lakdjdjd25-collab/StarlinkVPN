name: NimHUB direct PasarGuard final probe

on:
  push:
    branches: ["agent/managed-accounts-production-e2e"]
    paths: [".github/workflows/managed-accounts-production-e2e.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Start Railway device authentication
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/railway-auth-public.pem
          openssl pkey -pubin -in /tmp/railway-auth-public.pem -noout
          : > /tmp/railway-login.log
          RUNNER_TRACKING_ID="" nohup railway login --browserless > /tmp/railway-login.log 2>&1 &
          echo $! > /tmp/railway-login.pid
          for i in $(seq 1 45); do
            if grep -Eq 'https?://|code|Code|pair|Pair|sign in|Sign in' /tmp/railway-login.log; then break; fi
            PID=$(cat /tmp/railway-login.pid)
            if ! kill -0 "$PID" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          tail -c 400 /tmp/railway-login.log > /tmp/railway-login-prompt.txt
          test -s /tmp/railway-login-prompt.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/railway-auth-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/railway-login-prompt.txt -out /tmp/railway-login-prompt.bin
          base64 -w0 /tmp/railway-login-prompt.bin > /tmp/railway-login-prompt.b64
      - name: Upload encrypted Railway device prompt
        uses: actions/upload-artifact@v4
        with:
          name: railway-device-prompt-direct-pg
          path: /tmp/railway-login-prompt.b64
          if-no-files-found: error
          retention-days: 1
      - name: Wait for Railway authentication
        shell: bash
        run: |
          set -euo pipefail
          PID=$(cat /tmp/railway-login.pid)
          for i in $(seq 1 300); do
            if ! kill -0 "$PID" 2>/dev/null; then railway whoami --json >/dev/null; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Direct read-only PasarGuard probe
        shell: bash
        run: |
          set -euo pipefail
          railway run --project d2b3a600-5b04-4ba9-a341-7959ab38e187 --service control-plane --environment production --no-local node - <<'NODE'
          const fs = require('fs');
          (async () => {
            const baseValue = process.env.PASARGUARD_BASE_URL;
            const username = process.env.PASARGUARD_USERNAME;
            const password = process.env.PASARGUARD_PASSWORD;
            if (!baseValue || !username || !password) throw new Error('pasarguard_env_missing');
            let base = new URL(baseValue.trim());
            const idx = base.pathname.toLowerCase().indexOf('/dashboard');
            if (idx >= 0) base.pathname = base.pathname.slice(0, idx) || '/';
            base.pathname = base.pathname.replace(/\/+$/, '') + '/';
            base.search = ''; base.hash = ''; base.username = ''; base.password = '';
            const tokenBody = new URLSearchParams({grant_type:'password', username, password});
            const tokenRes = await fetch(new URL('api/admin/token', base), {method:'POST', headers:{'content-type':'application/x-www-form-urlencoded'}, body:tokenBody});
            if (!tokenRes.ok) throw new Error(`pasarguard_auth_${tokenRes.status}`);
            const tokenJson = await tokenRes.json().catch(() => null);
            if (!tokenJson?.access_token) throw new Error('pasarguard_token_invalid');
            const headers = {authorization:`Bearer ${tokenJson.access_token}`, accept:'application/json'};
            const groupsRes = await fetch(new URL('api/groups/simple?limit=100&offset=0', base), {headers});
            if (!groupsRes.ok) throw new Error(`pasarguard_groups_${groupsRes.status}`);
            const groupsJson = await groupsRes.json().catch(() => null);
            if (!Array.isArray(groupsJson?.groups)) throw new Error('pasarguard_groups_invalid');
            const templatesRes = await fetch(new URL('api/user_templates', base), {headers});
            if (!templatesRes.ok && templatesRes.status !== 403) throw new Error(`pasarguard_templates_${templatesRes.status}`);
            let templateCount = null;
            if (templatesRes.ok) {
              const templatesJson = await templatesRes.json().catch(() => null);
              if (!Array.isArray(templatesJson)) throw new Error('pasarguard_templates_invalid');
              templateCount = templatesJson.length;
            }
            const usersRes = await fetch(new URL('api/users?load_sub=false&limit=1&offset=0', base), {headers});
            if (!usersRes.ok) throw new Error(`pasarguard_users_${usersRes.status}`);
            const usersJson = await usersRes.json().catch(() => null);
            if (!Array.isArray(usersJson?.users)) throw new Error('pasarguard_users_invalid');
            fs.writeFileSync('/tmp/pasarguard-direct-safe.json', JSON.stringify({pasarGuardAuth:true,groupsReadable:true,groupCount:groupsJson.groups.length,templatesReachable:true,templateCount,usersReadable:true}));
          })().catch((error) => { console.error(error instanceof Error ? error.message : 'pasarguard_probe_failed'); process.exit(1); });
          NODE
      - name: Upload safe probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimhub-pasarguard-direct-safe
          path: /tmp/pasarguard-direct-safe.json
          if-no-files-found: warn
          retention-days: 7

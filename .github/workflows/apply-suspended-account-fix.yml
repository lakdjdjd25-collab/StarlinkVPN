name: Apply suspended account fix

on:
  push:
    branches:
      - fix/suspended-account-status-notification

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare suspended account fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/suspended-account-status-notification
          fetch-depth: 0

      - name: Apply focused changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          bootstrap = "apps/control-plane/src/app/api/v1/client/bootstrap/route.ts"
          replace_once(
              bootstrap,
              '          status: "ACTIVE",\n',
              '          status: { in: ["ACTIVE", "SUSPENDED"] },\n',
          )
          replace_once(
              bootstrap,
              '  if (!user || user.status !== "ACTIVE") {\n    return fail(403, "account_unavailable", "The account is unavailable");\n  }\n  if (auth.serviceId && user.services.length !== 1) {\n    return fail(403, "license_unavailable", "The licensed service is no longer active");\n  }\n  const hasPaidService = user.services.some((service) => !service.isFree);\n',
              '  if (!user || user.status === "DELETED") {\n    return fail(403, "account_unavailable", "The account is unavailable");\n  }\n  const visibleServices = user.services.filter((service) =>\n    user.status === "SUSPENDED" ? service.status === "SUSPENDED" : service.status === "ACTIVE",\n  );\n  if (auth.serviceId && visibleServices.length !== 1) {\n    return fail(403, "license_unavailable", "The licensed service is no longer available");\n  }\n  const hasPaidService = visibleServices.some((service) => !service.isFree);\n',
          )
          replace_once(
              bootstrap,
              '      language: user.language,\n',
              '      language: user.language,\n      status: user.status,\n',
          )
          replace_once(
              bootstrap,
              '    services: user.services.map((service) => ({\n',
              '    services: visibleServices.map((service) => ({\n',
          )
          replace_once(
              bootstrap,
              '      servers: service.nodes.map(({ node }) => ({\n',
              '      servers: user.status === "SUSPENDED" ? [] : service.nodes.map(({ node }) => ({\n',
          )

          models = "apps/android/src/main/java/org/quickping/app/model/QuickPingModels.kt"
          replace_once(
              models,
              '    val language: String,\n)\n\ndata class NotificationItem(',
              '    val language: String,\n    val status: String = "ACTIVE",\n)\n\ndata class NotificationItem(',
          )

          api = "apps/android/src/main/java/org/quickping/app/data/network/QuickPingApiClient.kt"
          replace_once(
              api,
              '    language = optString("language", "fa"),\n)\n\nprivate fun JSONObject.toService()',
              '    language = optString("language", "fa"),\n    status = optString("status", "ACTIVE"),\n)\n\nprivate fun JSONObject.toService()',
          )

          account = "apps/android/src/main/java/org/quickping/app/ui/screens/AccountScreen.kt"
          replace_once(
              account,
              '                StatusPill(\n                    text = if (user.emailVerified) quickText("تأیید شده", "Verified") else quickText("تأیید نشده", "Unverified"),\n                    color = if (user.emailVerified) QuickPingColors.Success else QuickPingColors.Warning,\n                )\n',
              '                val suspended = user.status == "SUSPENDED"\n                StatusPill(\n                    text = when {\n                        suspended -> quickText("مسدود شده", "Blocked")\n                        user.emailVerified -> quickText("تأیید شده", "Verified")\n                        else -> quickText("تأیید نشده", "Unverified")\n                    },\n                    color = when {\n                        suspended -> QuickPingColors.Danger\n                        user.emailVerified -> QuickPingColors.Success\n                        else -> QuickPingColors.Warning\n                    },\n                )\n',
          )
          PY

          mkdir -p apps/control-plane/prisma/migrations/20260816143000_suspension_notifications
          cat > apps/control-plane/prisma/migrations/20260816143000_suspension_notifications/migration.sql <<'SQL'
          CREATE OR REPLACE FUNCTION "nimhub_notify_suspended_user"()
          RETURNS trigger AS $$
          DECLARE
            notification_id TEXT;
          BEGIN
            IF NEW."status" = 'SUSPENDED' AND OLD."status" IS DISTINCT FROM NEW."status" THEN
              notification_id := 'susp_' || substr(md5(NEW."id" || clock_timestamp()::text || random()::text), 1, 20);

              INSERT INTO "Notification" (
                "id", "title", "body", "audience", "actionUrl", "publishedAt", "expiresAt", "createdAt", "updatedAt"
              ) VALUES (
                notification_id,
                'حساب شما مسدود شد',
                'دسترسی حساب و سرویس‌های شما توسط مدیریت مسدود شده است. برای پیگیری با پشتیبانی تماس بگیرید.',
                'SELECTED',
                'nimhub://account/suspended',
                CURRENT_TIMESTAMP,
                NULL,
                CURRENT_TIMESTAMP,
                CURRENT_TIMESTAMP
              );

              INSERT INTO "NotificationDelivery" (
                "notificationId", "userId", "deliveredAt", "readAt"
              ) VALUES (
                notification_id,
                NEW."id",
                CURRENT_TIMESTAMP,
                NULL
              );
            END IF;
            RETURN NEW;
          END;
          $$ LANGUAGE plpgsql;

          DROP TRIGGER IF EXISTS "nimhub_user_suspension_notification" ON "User";
          CREATE TRIGGER "nimhub_user_suspension_notification"
          AFTER UPDATE OF "status" ON "User"
          FOR EACH ROW
          EXECUTE FUNCTION "nimhub_notify_suspended_user"();

          CREATE OR REPLACE FUNCTION "nimhub_cleanup_suspension_notification"()
          RETURNS trigger AS $$
          BEGIN
            IF OLD."notificationId" LIKE 'susp_%'
               AND NOT EXISTS (
                 SELECT 1 FROM "NotificationDelivery" WHERE "notificationId" = OLD."notificationId"
               ) THEN
              DELETE FROM "Notification" WHERE "id" = OLD."notificationId";
            END IF;
            RETURN OLD;
          END;
          $$ LANGUAGE plpgsql;

          DROP TRIGGER IF EXISTS "nimhub_suspension_notification_cleanup" ON "NotificationDelivery";
          CREATE TRIGGER "nimhub_suspension_notification_cleanup"
          AFTER DELETE ON "NotificationDelivery"
          FOR EACH ROW
          EXECUTE FUNCTION "nimhub_cleanup_suspension_notification"();
          SQL

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NimHUB Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-suspended-account-fix.yml
          git add apps/control-plane apps/android
          git commit -m "Show blocked account status and notification"
          git push origin HEAD:fix/suspended-account-status-notification

name: Apply final VPN and VIP UI corrections

on:
  push:
    branches:
      - fix/restore-vip-crown-gaming-unlimited

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-vip-crown-gaming-unlimited
          fetch-depth: 0

      - name: Apply reviewed corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Full-tunnel: restore the sanitizer that removes provider direct-route
          # rules before compiling the selected PasarGuard config. Without this,
          # a node can proxy Telegram-specific rules while sending unmatched traffic direct.
          service = "apps/android/src/main/java/org/quickping/app/vpn/QuickPingVpnService.kt"
          replace_once(
              service,
              '''                val runtimeSettings = settings.copy(
                    ipv6Enabled = false,
                    mtu = SAFE_TUN_MTU,
                )
                val compiled = VpnConfigCompiler.compile(
                    rawConfigJson = rawConfig,
''',
              '''                val runtimeSettings = settings.copy(
                    ipv6Enabled = false,
                    mtu = SAFE_TUN_MTU,
                )
                val sanitizedConfig = VpnRuntimeSanitizer.sanitize(rawConfig, runtimeSettings)
                val compiled = VpnConfigCompiler.compile(
                    rawConfigJson = sanitizedConfig,
''',
          )

          # 2) Server-row visual contract:
          # unlocked VIP => crown immediately after name, then Unlimited/Gaming;
          # locked VIP => capability icons stay by name, purple VIP occupies ping slot.
          rows = "apps/android/src/main/java/org/quickping/app/ui/screens/ReferenceServerRows.kt"
          old_badges = '''                if (server.unmetered || server.isUnlimitedCategory) {
                    Spacer(Modifier.width(5.dp))
                    ReferenceUnlimitedBadge()
                }
                if (server.isGaming) {
                    Spacer(Modifier.width(5.dp))
                    ReferenceGamingBadge()
                }
                if (lockedVip) {
                    Spacer(Modifier.width(5.dp))
                    ReferenceVipBadge()
                } else if (server.isVip) {
                    Spacer(Modifier.width(5.dp))
                    Icon(
                        painter = painterResource(R.drawable.ic_vip_crown),
                        contentDescription = quickText("سرور VIP", "VIP server"),
                        tint = Color.Unspecified,
                        modifier = Modifier.size(18.dp),
                    )
                }
            }
            if (!lockedVip) {
                Spacer(Modifier.width(7.dp))
                CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                    ReferencePingChip(server.pingMs)
                }
            }
'''
          new_badges = '''                if (server.isVip && !lockedVip) {
                    Spacer(Modifier.width(5.dp))
                    Icon(
                        painter = painterResource(R.drawable.ic_vip_crown),
                        contentDescription = quickText("سرور VIP", "VIP server"),
                        tint = Color.Unspecified,
                        modifier = Modifier.size(18.dp),
                    )
                }
                if (server.unmetered || server.isUnlimitedCategory) {
                    Spacer(Modifier.width(5.dp))
                    ReferenceUnlimitedBadge()
                }
                if (server.isGaming) {
                    Spacer(Modifier.width(5.dp))
                    ReferenceGamingBadge()
                }
            }
            Spacer(Modifier.width(7.dp))
            if (lockedVip) {
                ReferenceVipBadge()
            } else {
                CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                    ReferencePingChip(server.pingMs)
                }
            }
'''
          replace_once(rows, old_badges, new_badges)

          # 3) Account avatar: app logo, circular for every account. VIP crown remains separate.
          account = "apps/android/src/main/java/org/quickping/app/ui/screens/AccountScreen.kt"
          replace_once(
              account,
              '''            Box(
                modifier = Modifier.size(48.dp).clip(RoundedCornerShape(16.dp)).background(Color(0xFF284D85)),
                contentAlignment = Alignment.Center,
            ) {
                Icon(painterResource(R.drawable.ic_user), null, tint = Color(0xFF94BCFF), modifier = Modifier.size(28.dp))
            }
''',
              '''            Box(
                modifier = Modifier
                    .size(48.dp)
                    .clip(CircleShape)
                    .background(QuickPingColors.SurfaceHigh),
                contentAlignment = Alignment.Center,
            ) {
                Icon(
                    painter = painterResource(R.drawable.ic_logo),
                    contentDescription = quickText("NimHUB", "NimHUB"),
                    tint = Color.Unspecified,
                    modifier = Modifier.size(42.dp),
                )
            }
''',
          )

          # 4) VIP revocation/stale entitlement reconciliation. Backend VIP enforcement stays strict;
          # Android refreshes bootstrap and retries once on another real STANDARD/selectable node.
          vm = "apps/android/src/main/java/org/quickping/app/state/QuickPingViewModel.kt"
          old_runtime = '''            runCatching {
                val config = repository.runtimeConfig(serviceId, serverId)
                runtimeStore.write(config)
                val application = getApplication<Application>()
'''
          new_runtime = '''            runCatching {
                val config = try {
                    repository.runtimeConfig(serviceId, serverId)
                } catch (error: ApiException) {
                    if (error.code != "VIP_ACCESS_REQUIRED") throw error

                    val bootstrap = repository.restoreSession() ?: throw error
                    settingsStore.saveManagement(bootstrap.management)
                    val guardian = mergeGuardian(bootstrap)
                    val refreshed = _state.value.withBootstrap(bootstrap, guardian)
                    val failedServerId = serverId
                    val fallback = refreshed.servers.firstOrNull {
                        it.id != failedServerId && it.selectable && !it.isVip
                    } ?: refreshed.servers.firstOrNull {
                        it.id != failedServerId && it.selectable
                    }

                    if (fallback == null || refreshed.service.id.isBlank()) {
                        _state.value = refreshed
                        settingsStore.saveSelectedServerId(refreshed.selectedServerId)
                        throw error
                    }

                    settingsStore.saveSelectedServerId(fallback.id)
                    _state.value = refreshed.copy(
                        selectedServerId = fallback.id,
                        connectionStatus = ConnectionStatus.Connecting,
                        connectionError = null,
                        connectionErrorCode = null,
                    )
                    repository.runtimeConfig(refreshed.service.id, fallback.id)
                }
                runtimeStore.write(config)
                val application = getApplication<Application>()
'''
          replace_once(vm, old_runtime, new_runtime)

          # Helper-level regression test for deterministic fallback policy.
          test_path = Path("apps/android/src/test/java/org/quickping/app/state/VipRevocationRecoveryPolicyTest.kt")
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text('''package org.quickping.app.state

import org.junit.Assert.assertEquals
import org.junit.Assert.assertNull
import org.junit.Test
import org.quickping.app.model.Server

class VipRevocationRecoveryPolicyTest {
    private fun server(id: String, vip: Boolean, selectable: Boolean) = Server(
        id = id,
        countryCode = "de",
        countryName = "Germany",
        title = id,
        accessTier = if (vip) "VIP" else "STANDARD",
        requiresVip = vip,
        locked = !selectable,
        canConnect = selectable,
    )

    @Test
    fun `revoked VIP falls back to another standard server`() {
        val failed = "france"
        val servers = listOf(
            server(failed, vip = true, selectable = false),
            server("uk", vip = false, selectable = true),
            server("vip-2", vip = true, selectable = false),
        )
        assertEquals("uk", vipRevocationFallbackServerId(failed, servers))
    }

    @Test
    fun `failed stale node is never retried as its own fallback`() {
        val failed = "france"
        val servers = listOf(server(failed, vip = false, selectable = true))
        assertNull(vipRevocationFallbackServerId(failed, servers))
    }
}
''')

          # Extract the fallback policy into a tiny pure helper so the above behavior is testable.
          old_fallback = '''                    val fallback = refreshed.servers.firstOrNull {
                        it.id != failedServerId && it.selectable && !it.isVip
                    } ?: refreshed.servers.firstOrNull {
                        it.id != failedServerId && it.selectable
                    }
'''
          new_fallback = '''                    val fallbackId = vipRevocationFallbackServerId(failedServerId, refreshed.servers)
                    val fallback = refreshed.servers.firstOrNull { it.id == fallbackId }
'''
          replace_once(vm, old_fallback, new_fallback)

          marker = 'private fun Throwable.loginMessage(): String = when (this) {'
          helper = '''internal fun vipRevocationFallbackServerId(
    failedServerId: String,
    servers: List<org.quickping.app.model.Server>,
): String? = servers.firstOrNull {
    it.id != failedServerId && it.selectable && !it.isVip
}?.id ?: servers.firstOrNull {
    it.id != failedServerId && it.selectable
}?.id

'''
          replace_once(vm, marker, helper + marker)
          PY

      - name: Commit corrections and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-final-vpn-ui-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android
          git commit -m "Fix full-tunnel routing and final VIP UI/access behavior"
          git push origin HEAD:fix/restore-vip-crown-gaming-unlimited

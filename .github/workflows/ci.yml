name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://quickping:quickping@127.0.0.1:5432/quickping

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Ensure CI-only debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=nimHUB CI Debug,O=nimHUB,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          test -s "$HOME/.android/debug.keystore"
      - uses: actions/cache/restore@v4
        id: libbox-cache
        with:
          path: apps/android/libs/libbox.aar
          key: libbox-android-v1.13.18-${{ hashFiles('scripts/build-sing-box-android.sh') }}
      - uses: actions/setup-go@v5
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          go-version: 1.25.12
          cache: false
      - if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: yes | sdkmanager "ndk;28.0.13004108"
      - if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-sing-box-android.sh
      - uses: actions/cache/save@v4
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          path: apps/android/libs/libbox.aar
          key: libbox-android-v1.13.18-${{ hashFiles('scripts/build-sing-box-android.sh') }}
      - name: Build debug, minified release and unit tests
        run: ./gradlew :apps:android:assembleDebug :apps:android:assembleRelease :apps:android:testDebugUnitTest --stacktrace
      - name: Verify CI debug certificate and unsigned release audit output
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK=$(find apps/android/build/outputs/apk/debug -name '*.apk' | head -n 1)
          RELEASE_APK=$(find apps/android/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$DEBUG_APK"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RELEASE_APK" >/dev/null 2>&1; then
            echo "PR/CI release APK must stay unsigned; production signing is isolated to the manual signing workflow." >&2
            exit 1
          fi
          echo "Release APK correctly remains unsigned for static audit."
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nimHUB-ci-debug-no-google-oauth
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nimHUB-ci-release-unsigned-static-audit
          path: apps/android/build/outputs/apk/release/*.apk
          if-no-files-found: error

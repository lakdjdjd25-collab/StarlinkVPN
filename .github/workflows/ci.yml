name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://quickping:quickping@127.0.0.1:5432/quickping

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/cache/restore@v4
        id: debug-keystore-cache
        with:
          path: ~/.android/debug.keystore
          key: quickping-android-debug-keystore-v2
      - name: Ensure stable debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          test -s "$HOME/.android/debug.keystore"
      - uses: actions/cache/restore@v4
        id: libbox-cache
        with:
          path: apps/android/libs/libbox.aar
          key: libbox-android-v1.13.18-${{ hashFiles('scripts/build-sing-box-android.sh') }}
      - uses: actions/setup-go@v5
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          go-version: 1.25.12
          cache: false
      - if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: yes | sdkmanager "ndk;28.0.13004108"
      - if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-sing-box-android.sh
      - uses: actions/cache/save@v4
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          path: apps/android/libs/libbox.aar
          key: libbox-android-v1.13.18-${{ hashFiles('scripts/build-sing-box-android.sh') }}
      - run: ./gradlew :apps:android:assembleDebug :apps:android:assembleRelease :apps:android:testDebugUnitTest --stacktrace
      - uses: actions/cache/save@v4
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.android/debug.keystore
          key: quickping-android-debug-keystore-v2
      - run: |
          APK=$(find apps/android/build/outputs/apk/debug -name '*.apk' | head -n 1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NimHUB-Vpn-2.6.19-debug
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  patch-login-source:
    if: github.ref == 'refs/heads/feat/nimhub-2.6.11-login-qr-google'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch once
        shell: bash
        run: |
          if [ -f .github/patch-2.6.11-login-applied ]; then
            echo "Patch already applied"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          p = Path('apps/android/src/main/java/org/quickping/app/ui/screens/ReferenceLoginScreen.kt')
          s = p.read_text()
          s = s.replace(
              'import androidx.compose.foundation.text.BasicTextField\nimport androidx.compose.foundation.text.KeyboardOptions',
              'import androidx.compose.foundation.text.BasicTextField\nimport androidx.compose.foundation.text.KeyboardActions\nimport androidx.compose.foundation.text.KeyboardOptions',
          )
          s = s.replace(
              'import androidx.compose.ui.text.input.KeyboardType\nimport androidx.compose.ui.text.input.PasswordVisualTransformation',
              'import androidx.compose.ui.text.input.ImeAction\nimport androidx.compose.ui.text.input.KeyboardType\nimport androidx.compose.ui.text.input.PasswordVisualTransformation',
          )
          for line in [
              'import com.google.android.gms.common.moduleinstall.InstallStatusListener\n',
              'import com.google.android.gms.common.moduleinstall.ModuleInstall\n',
              'import com.google.android.gms.common.moduleinstall.ModuleInstallRequest\n',
              'import com.google.android.gms.common.moduleinstall.ModuleInstallStatusUpdate\n',
              'import com.google.android.gms.common.moduleinstall.ModuleInstallStatusUpdate.InstallState.STATE_CANCELED\n',
              'import com.google.android.gms.common.moduleinstall.ModuleInstallStatusUpdate.InstallState.STATE_COMPLETED\n',
              'import com.google.android.gms.common.moduleinstall.ModuleInstallStatusUpdate.InstallState.STATE_FAILED\n',
          ]:
              s = s.replace(line, '')
          s = s.replace('    var scannerPreparing by remember { mutableStateOf(false) }\n', '')

          start_marker = '    val scanner = remember(context, scannerOptions) { GmsBarcodeScanning.getClient(context, scannerOptions) }'
          start = s.index(start_marker)
          end = s.index('\n    Box(Modifier.fillMaxSize().background(Color(0xFF05070B)))', start)
          scanner_block = '''    val scanner = remember(context, scannerOptions) { GmsBarcodeScanning.getClient(context, scannerOptions) }
    val qrNotFoundText = quickText("کد مجوز در QR پیدا نشد", "License code was not found in the QR")
    val qrFailedText = quickText("اسکن QR انجام نشد", "QR scan failed")
    val licenseInvalidText = quickText("کد مجوز معتبر نیست", "License code is not valid")

    fun submitLicense(raw: String, fromQr: Boolean = false) {
        val parsed = referenceExtractLicense(raw)
        if (parsed.isBlank()) {
            scanError = if (fromQr) qrNotFoundText else licenseInvalidText
            return
        }
        license = parsed
        scanError = null
        focusManager.clearFocus()
        keyboardController?.hide()
        onPasswordLogin(parsed, "")
    }

    fun launchQrScanner() {
        scanError = null
        scanner.startScan()
            .addOnSuccessListener { barcode -> submitLicense(barcode.rawValue.orEmpty(), fromQr = true) }
            .addOnCanceledListener { scanError = null }
            .addOnFailureListener { scanError = qrFailedText }
    }
'''
          s = s[:start] + scanner_block + s[end:]

          old_call = '''                onBack = {
                    license = ""
                    focusManager.clearFocus()
                    keyboardController?.hide()
                },
                onScan = { prepareAndLaunchQrScanner() },
                onSubmit = {
                    val value = license.trim()
                    if (value.isNotBlank()) {
                        focusManager.clearFocus()
                        keyboardController?.hide()
                        onPasswordLogin(value, "")
                    }
                },'''
          new_call = '''                onScan = { launchQrScanner() },
                onSubmit = { submitLicense(license) },'''
          if old_call not in s:
              raise SystemExit('license call block not found')
          s = s.replace(old_call, new_call, 1)

          signature_old = '    onValueChange: (String) -> Unit,\n    onBack: () -> Unit,\n    onScan: () -> Unit,'
          signature_new = '    onValueChange: (String) -> Unit,\n    onScan: () -> Unit,'
          if signature_old not in s:
              raise SystemExit('license signature not found')
          s = s.replace(signature_old, signature_new, 1)

          old_buttons = '''            ReferenceLoginInnerButton(R.drawable.ic_arrow_back, onBack)
            Spacer(Modifier.width(6.dp))
            ReferenceLoginInnerButton(R.drawable.ic_scan, onScan)'''
          new_buttons = '''            ReferenceLoginInnerButton(R.drawable.ic_arrow_back, onSubmit, enabled && value.isNotBlank())
            Spacer(Modifier.width(6.dp))
            ReferenceLoginInnerButton(R.drawable.ic_scan, onScan)'''
          if old_buttons not in s:
              raise SystemExit('license left buttons not found')
          s = s.replace(old_buttons, new_buttons, 1)

          ticket_old = '            ReferenceLoginInnerButton(R.drawable.ic_ticket, onSubmit, enabled && value.isNotBlank())'
          if ticket_old not in s:
              raise SystemExit('license ticket button not found')
          s = s.replace(ticket_old, '            ReferenceLoginInnerButton(R.drawable.ic_ticket, onClick = {})', 1)

          keyboard_old = '                    keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Text),'
          keyboard_new = '                    keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Text, imeAction = ImeAction.Done),\n                    keyboardActions = KeyboardActions(onDone = { if (enabled && value.isNotBlank()) onSubmit() }),'
          if keyboard_old not in s:
              raise SystemExit('license keyboard options not found')
          s = s.replace(keyboard_old, keyboard_new, 1)

          error_old = '    message.contains("License is invalid or inactive", ignoreCase = true) ->\n        quickText("مجوز معتبر یا فعال نیست", "License is invalid or inactive")'
          error_new = '    message.contains("License is invalid", ignoreCase = true) ->\n        quickText("مجوز نامعتبر، منقضی یا بدون حجم باقی‌مانده است", "License is invalid, expired, or has no remaining quota")\n    message.contains("This license allows up to", ignoreCase = true) ->\n        quickText("تعداد دستگاه‌های مجاز این مجوز تکمیل شده است", "The device limit for this license has been reached")'
          if error_old not in s:
              raise SystemExit('license error mapping not found')
          s = s.replace(error_old, error_new, 1)
          p.write_text(s)
          PY

          mkdir -p apps/android/src/test/java/org/quickping/app/ui/screens
          cat > apps/android/src/test/java/org/quickping/app/ui/screens/ReferenceLoginLicenseTest.kt <<'EOF'
          package org.quickping.app.ui.screens

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class ReferenceLoginLicenseTest {
              @Test fun plainLicenseIsNormalized() {
                  assertEquals("ABC123-XY", referenceExtractLicense("  abc123-xy  "))
              }

              @Test fun prefixedLicenseIsNormalized() {
                  assertEquals("ABC123-XY", referenceExtractLicense("license: abc123-xy"))
              }

              @Test fun malformedLicenseIsRejected() {
                  assertTrue(referenceExtractLicense("bad code with spaces").isBlank())
              }
          }
          EOF
          touch .github/patch-2.6.11-login-applied
          git diff --check
          git config user.name "lakdjdjd25-collab"
          git config user.email "lakdjdjd25@gmail.com"
          git add apps/android/src/main/java/org/quickping/app/ui/screens/ReferenceLoginScreen.kt \
                  apps/android/src/test/java/org/quickping/app/ui/screens/ReferenceLoginLicenseTest.kt \
                  .github/patch-2.6.11-login-applied
          git commit -m "fix(android): make QR and license login actionable"
          git push origin HEAD:feat/nimhub-2.6.11-login-qr-google

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://quickping:quickping@127.0.0.1:5432/quickping

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/cache/restore@v4
        id: debug-keystore-cache
        with:
          path: ~/.android/debug.keystore
          key: quickping-android-debug-keystore-v2
      - name: Verify canonical debug signing key
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          EXPECTED_SHA1="AF:40:02:16:67:06:8E:78:AA:6F:E3:D6:67:04:92:2B:E6:82:A0:FE"
          if [ ! -s "$KEYSTORE" ]; then
            echo "Canonical NimHUB debug keystore is unavailable; refusing to create a new OAuth identity."
            exit 1
          fi
          ACTUAL_SHA1=$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)
          echo "Android OAuth signing SHA1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "Signing fingerprint changed; refusing to build an APK that would break Google OAuth."
            exit 1
          fi
      - uses: actions/cache/restore@v4
        id: libbox-cache
        with:
          path: apps/android/libs/libbox.aar
          key: libbox-android-v1.13.18-${{ hashFiles('scripts/build-sing-box-android.sh') }}
      - uses: actions/setup-go@v5
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          go-version: 1.25.12
          cache: false
      - if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: yes | sdkmanager "ndk;28.0.13004108"
      - if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-sing-box-android.sh
      - uses: actions/cache/save@v4
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          path: apps/android/libs/libbox.aar
          key: libbox-android-v1.13.18-${{ hashFiles('scripts/build-sing-box-android.sh') }}
      - run: ./gradlew :apps:android:assembleDebug :apps:android:testDebugUnitTest --stacktrace
      - run: |
          APK=$(find apps/android/build/outputs/apk/debug -name '*.apk' | head -n 1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NimHUB-Vpn-debug
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

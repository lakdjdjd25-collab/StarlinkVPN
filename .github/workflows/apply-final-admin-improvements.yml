name: Apply complete final NimHUB improvements
on:
  push:
    branches:
      - agent/final-admin-improvements
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply complete patch
        run: |
          set -euo pipefail
          cat .nimhub-patch/part1 .nimhub-patch/part2 .nimhub-patch/part3 .nimhub-patch/part4 .nimhub-patch/part5 .nimhub-patch/part6 > /tmp/nimhub-final.patch.gz.b64
          echo "3c9c106be2e5e49f5f4fe2391f31ca91769d094927570cc7ef5ae1e6e6699811  /tmp/nimhub-final.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/nimhub-final.patch.gz.b64 | gunzip > /tmp/nimhub-final.patch
          echo "f2351763652f3d5199ed723e068a90aec4298c3b30320533b17c39790f00f6c4  /tmp/nimhub-final.patch" | sha256sum -c -
          git apply --check /tmp/nimhub-final.patch
          git apply /tmp/nimhub-final.patch
          rm -rf .nimhub-patch
          rm -f .nimhub-final-patch.tar.gz
          rm -f .github/workflows/source-snapshot-final.yml
          rm -f .github/workflows/apply-final-patch.yml
          rm -f .github/workflows/apply-final-admin-improvements.yml
          git config user.name "NimHUB Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement dynamic admin notifications localization and PasarGuard switching"
          git push origin HEAD:agent/final-admin-improvements

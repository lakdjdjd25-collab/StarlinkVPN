name: Fix migration test module

on:
  push:
    branches: [fix/simple-provider-migration]
    paths: [.github/workflows/fix-migration-test-module.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-provider-migration
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shape = Path("apps/control-plane/src/lib/pasarguard/migration-shape.ts")
          shape.write_text('''import { PasarGuardError } from "./client";\n\nexport type MigrationTransferShape = {\n  usageOffsetBytes: bigint;\n  remoteDataLimitBytes: bigint;\n  remainingBytes: bigint;\n};\n\nexport function migrationTransferShape(\n  totalBytes: bigint,\n  usedBytes: bigint,\n  remoteUsedBytes: bigint,\n): MigrationTransferShape {\n  if (totalBytes <= 0n || usedBytes < 0n || remoteUsedBytes < 0n) {\n    throw new PasarGuardError("invalid_response", "وضعیت حجم سرویس برای انتقال معتبر نیست");\n  }\n  if (usedBytes >= totalBytes) {\n    throw new PasarGuardError("invalid_response", "حجم این سرویس تمام شده است؛ پس از افزایش حجم می‌توان آن را منتقل کرد");\n  }\n  if (remoteUsedBytes > usedBytes) {\n    throw new PasarGuardError(\n      "invalid_response",\n      "کاربر هم‌نام در پنل جدید مصرف بیشتری از سابقه NimHUB دارد و نیازمند بررسی دستی است",\n    );\n  }\n  const remainingBytes = totalBytes - usedBytes;\n  const usageOffsetBytes = usedBytes - remoteUsedBytes;\n  const remoteDataLimitBytes = totalBytes - usageOffsetBytes;\n  if (remoteDataLimitBytes <= remoteUsedBytes) {\n    throw new PasarGuardError("invalid_response", "حجم باقی‌مانده برای انتقال معتبر نیست");\n  }\n  return { usageOffsetBytes, remoteDataLimitBytes, remainingBytes };\n}\n''')

          migration = Path("apps/control-plane/src/lib/pasarguard/migration.ts")
          text = migration.read_text()
          marker = 'import { syncPasarGuardBinding } from "@/lib/pasarguard/sync";\n'
          text = text.replace(marker, marker + 'import { migrationTransferShape } from "./migration-shape";\n', 1)
          start = text.index('export type MigrationTransferShape = {')
          end = text.index('function mappingGroups', start)
          text = text[:start] + text[end:]
          migration.write_text(text)

          test = Path("apps/control-plane/src/lib/pasarguard/migration.test.ts")
          test.write_text(test.read_text().replace('from "./migration";', 'from "./migration-shape";'))

          Path(".github/workflows/fix-migration-test-module.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Isolate provider migration traffic calculation"
          git push origin HEAD:fix/simple-provider-migration

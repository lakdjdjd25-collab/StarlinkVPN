name: Deploy latest NimHUB control-plane

on:
  push:
    branches: ["agent/railway-source-deploy"]
    paths: [".github/workflows/deploy-latest-control-plane.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact production source
        uses: actions/checkout@v4
        with:
          ref: a666b00076f8c5f14cad1d66e79f8a5d42bce746
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Start Railway device authentication
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/railway-auth-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA8eH7h2Ng3hZf5uIlZnMD
          W59MrlQ5hRdZTHKHl7rC3FAdkoBnRhaWBqY13uANh1c615NEIUig0SCIq38PuVDX
          FpZ+1mbrwIfpFlaed8vCAVMrDHaqLflV7++uHAnHoK6x5zbansSfDiqaZKnihQJc
          XOU5z/C1+3SzYpCCKhfTqCaC61yTAnHpIJeSp6oTWfOUjgX79U2dfxw/NBV3JN4t
          h21Bb8BS8CSg/OlDIr96v8eU2KMA/Lj44s8Wa5Q2i0kGQh6F9BQezO856l2ElO+g
          wjiYQNpVm8MdYK2yqCB+88SVZSXCwckFSp8nzEYNx1VuqxYgGRAsQdZe/E1bdmi8
          fnmqKC3mPHo7JDog4wMOj5E9yQPAyoSuo1QM1yi65tl3NwjsLGVF5do9aQ4KAf+A
          HRz7GvI0u2qxXjHuWXKanCVtLWlf9Ss8HtwgOYG68Kn3X4fPfXDz4HngwRxGnB+D
          l5ocBwpblVGLk6sj2UqggZG5eVIxPwanpWmfOwK02WRmjbYheqkF/UVJSzBvzH1c
          kp/xvX/EXokoNSv5nR+2zSYVdoTJuhmjcVvZSmFxZ+5tVLZiRecs/muY0Q2LYgzD
          MeOXoYPlBFJVRh/VL/M/FRB4/9XbKSKS5i/I5rHGIlsfT4JHMV607yNb4XrmtAT7
          NRC2P19cRpDPVYhhFMITPdECAwEAAQ==
          -----END PUBLIC KEY-----
          EOF

          : > /tmp/railway-login.log
          RUNNER_TRACKING_ID="" nohup railway login --browserless > /tmp/railway-login.log 2>&1 &
          echo $! > /tmp/railway-login.pid

          for i in $(seq 1 45); do
            if grep -Eq 'https?://|code|Code|pair|Pair|sign in|Sign in' /tmp/railway-login.log; then
              break
            fi
            PID=$(cat /tmp/railway-login.pid)
            if ! kill -0 "$PID" 2>/dev/null; then
              cat /tmp/railway-login.log
              exit 1
            fi
            sleep 1
          done

          tail -c 400 /tmp/railway-login.log > /tmp/railway-login-prompt.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/railway-auth-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/railway-login-prompt.txt -out /tmp/railway-login-prompt.bin
          base64 -w0 /tmp/railway-login-prompt.bin > /tmp/railway-login-prompt.b64
      - name: Upload encrypted Railway device prompt
        uses: actions/upload-artifact@v4
        with:
          name: railway-device-prompt-encrypted
          path: /tmp/railway-login-prompt.b64
          if-no-files-found: error
          retention-days: 1
      - name: Wait for Railway authentication
        shell: bash
        run: |
          set -euo pipefail
          PID=$(cat /tmp/railway-login.pid)
          for i in $(seq 1 300); do
            if ! kill -0 "$PID" 2>/dev/null; then
              railway whoami --json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/railway-login.log
          exit 1
      - name: Link production service
        run: railway link --project d2b3a600-5b04-4ba9-a341-7959ab38e187 --environment production --service control-plane
      - name: Deploy exact source to production
        run: railway up --service control-plane --environment production --detach -m "Deploy NimHUB managed accounts from a666b00076f8c5f14cad1d66e79f8a5d42bce746"
      - name: Verify deployment status
        shell: bash
        run: |
          for i in $(seq 1 90); do
            STATUS=$(railway deployment list --service control-plane --environment production --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s); const d=Array.isArray(x)?x[0]:x.deployments?.[0]; console.log(d?.status||"")})')
            echo "deployment_status=$STATUS"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|SKIPPED|REMOVED) exit 1 ;;
            esac
            sleep 5
          done
          exit 1

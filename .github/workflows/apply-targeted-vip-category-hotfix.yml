name: Apply targeted VIP/category hotfix

on:
  push:
    branches:
      - fix/restore-vip-crown-gaming-unlimited

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-vip-crown-gaming-unlimited
          fetch-depth: 0
      - name: Apply focused source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_section(path: str, start: str, end: str, new_section: str) -> None:
              p = Path(path)
              text = p.read_text()
              start_at = text.find(start)
              if start_at < 0:
                  raise SystemExit(f"Start marker not found in {path}: {start!r}")
              end_at = text.find(end, start_at)
              if end_at < 0:
                  raise SystemExit(f"End marker not found in {path}: {end!r}")
              p.write_text(text[:start_at] + new_section + text[end_at:])

          api = "apps/android/src/main/java/org/quickping/app/data/network/QuickPingApiClient.kt"
          replace_once(
              api,
              '            category = item.optNullableString("category"),\n            serverType = item.optString("serverType", "MANAGED"),',
              '            category = item.optNullableString("category"),\n            subcategory = item.optNullableString("subcategory"),\n            volumeBytes = if (item.isNull("volumeBytes")) null else item.optLongFlexible("volumeBytes"),\n            serverType = item.optString("serverType", "MANAGED"),',
          )

          account = "apps/android/src/main/java/org/quickping/app/ui/screens/AccountScreen.kt"
          replace_once(
              account,
              '            ProfileCard(\n                user = user,\n',
              '            ProfileCard(\n                user = user,\n                vipAccess = service.vipAccess,\n',
          )
          replace_once(
              account,
              'private fun ProfileCard(\n    user: UserInfo,\n    onChangePassword: () -> Unit,',
              'private fun ProfileCard(\n    user: UserInfo,\n    vipAccess: Boolean,\n    onChangePassword: () -> Unit,',
          )
          old_email = '''                Text(
                    user.email,
                    color = QuickPingColors.TextPrimary,
                    style = MaterialTheme.typography.bodyLarge,
                    fontWeight = FontWeight.Medium,
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis,
                )'''
          new_email = '''                Row(verticalAlignment = Alignment.CenterVertically) {
                    Text(
                        user.email,
                        modifier = Modifier.weight(1f, fill = false),
                        color = QuickPingColors.TextPrimary,
                        style = MaterialTheme.typography.bodyLarge,
                        fontWeight = FontWeight.Medium,
                        maxLines = 1,
                        overflow = TextOverflow.Ellipsis,
                    )
                    if (vipAccess) {
                        Spacer(Modifier.width(6.dp))
                        Icon(
                            painter = painterResource(R.drawable.ic_vip_crown),
                            contentDescription = quickText("کاربر VIP", "VIP user"),
                            tint = Color.Unspecified,
                            modifier = Modifier.size(17.dp),
                        )
                    }
                }'''
          replace_once(account, old_email, new_email)

          vm = "apps/android/src/main/java/org/quickping/app/state/QuickPingViewModel.kt"
          connect_section = '''    fun connectVpn() {
        val current = _state.value
        val selectedServer = current.servers.firstOrNull {
            it.id == current.selectedServerId && it.selectable
        } ?: current.servers.firstOrNull { it.selectable }
        if (selectedServer == null || current.service.id.isBlank()) {
            _state.update {
                it.copy(
                    connectionStatus = ConnectionStatus.Error,
                    connectionError = if (current.service.pendingReview)
                        "سرویس در حال بررسی انتقال به پنل جدید است"
                    else "هیچ سرور قابل اتصالی برای این سرویس وجود ندارد",
                    connectionErrorCode = if (current.service.pendingReview) "service_pending_review" else "no_server",
                )
            }
            return
        }
        if (selectedServer.id != current.selectedServerId) {
            settingsStore.saveSelectedServerId(selectedServer.id)
            _state.update { it.copy(selectedServerId = selectedServer.id) }
        }
        val serviceId = current.service.id
        val serverId = selectedServer.id
        viewModelScope.launch {
            _state.update {
                it.copy(
                    connectionStatus = ConnectionStatus.Connecting,
                    connectionError = null,
                    connectionErrorCode = null,
                )
            }
            runCatching {
                val config = repository.runtimeConfig(serviceId, serverId)
                runtimeStore.write(config)
                val application = getApplication<Application>()
                ContextCompat.startForegroundService(
                    application,
                    Intent(application, QuickPingVpnService::class.java)
                        .setAction(QuickPingVpnService.ACTION_CONNECT)
                )
            }.onFailure { error ->
                _state.update { state ->
                    state.copy(
                        connectionStatus = ConnectionStatus.Error,
                        connectionError = error.connectionMessage(),
                        connectionErrorCode = if (error is ApiException) error.code else "config_download",
                    )
                }
            }
        }
    }

'''
          replace_section(vm, '    fun connectVpn() {', '    fun disconnectVpn() {', connect_section)

          select_section = '''    fun selectServer(id: String) {
        val target = _state.value.servers.firstOrNull { it.id == id && it.selectable } ?: return
        if (target.id == _state.value.selectedServerId) return
        settingsStore.saveSelectedServerId(target.id)
        _state.update { it.copy(selectedServerId = target.id) }
        restartVpnIfActive()
    }

'''
          replace_section(vm, '    fun selectServer(id: String) {', '    fun refreshServerPings() {', select_section)

          account_refresh = '''    fun refreshAccountState() {
        viewModelScope.launch {
            val bootstrap = repository.restoreSession() ?: return@launch
            settingsStore.saveManagement(bootstrap.management)
            val guardian = mergeGuardian(bootstrap)
            val previous = _state.value
            val next = previous.withBootstrap(bootstrap, guardian)
            val previousSelectionStillConnectable = next.servers.any {
                it.id == previous.selectedServerId && it.selectable
            }
            if (
                bootstrap.user.status == "SUSPENDED" ||
                bootstrap.services.firstOrNull()?.pendingReview == true ||
                (previous.connectionStatus in setOf(ConnectionStatus.Connected, ConnectionStatus.Connecting) &&
                    !previousSelectionStillConnectable)
            ) {
                disconnectVpn()
            }
            settingsStore.saveSelectedServerId(next.selectedServerId)
            _state.value = next
        }
    }

'''
          replace_section(vm, '    fun refreshAccountState() {', '    fun refreshNotificationsAndMarkRead() {', account_refresh)

          notifications_refresh = '''    fun refreshNotificationsAndMarkRead() {
        viewModelScope.launch {
            val bootstrap = repository.restoreSession() ?: return@launch
            settingsStore.saveManagement(bootstrap.management)
            val guardian = mergeGuardian(bootstrap)
            val previous = _state.value
            val next = previous.withBootstrap(bootstrap, guardian)
            val previousSelectionStillConnectable = next.servers.any {
                it.id == previous.selectedServerId && it.selectable
            }
            if (
                bootstrap.user.status == "SUSPENDED" ||
                (previous.connectionStatus in setOf(ConnectionStatus.Connected, ConnectionStatus.Connecting) &&
                    !previousSelectionStillConnectable)
            ) {
                disconnectVpn()
            }
            settingsStore.saveSelectedServerId(next.selectedServerId)
            _state.value = next
            val unreadIds = bootstrap.notifications.filterNot { it.read }.map { it.id }
            if (unreadIds.isNotEmpty()) {
                runCatching { repository.markNotificationsRead(unreadIds) }
                    .onSuccess {
                        _state.update { state ->
                            state.copy(notifications = state.notifications.map { notification ->
                                if (notification.id in unreadIds) notification.copy(read = true) else notification
                            })
                        }
                    }
            }
        }
    }

'''
          replace_section(vm, '    fun refreshNotificationsAndMarkRead() {', '    fun requestPasswordChange() {', notifications_refresh)

          old_selection = '''        selectedServerId = selectedServerId.takeIf { currentId ->
            currentId.isNotBlank() && servers.any { server -> server.id == currentId }
        } ?: servers.firstOrNull()?.id.orEmpty(),'''
          new_selection = '''        selectedServerId = resolveSelectedServerId(selectedServerId, servers),'''
          replace_once(vm, old_selection, new_selection)

          marker = 'private fun Throwable.loginMessage(): String = when (this) {'
          helper = '''internal fun resolveSelectedServerId(
    currentId: String,
    servers: List<org.quickping.app.model.Server>,
): String = servers.firstOrNull { server ->
    server.id == currentId && server.selectable
}?.id ?: servers.firstOrNull { it.selectable }?.id ?: servers.firstOrNull()?.id.orEmpty()

'''
          replace_once(vm, marker, helper + marker)

          test = Path("apps/android/src/test/java/org/quickping/app/state/VipSelectionFallbackTest.kt")
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package org.quickping.app.state

import org.junit.Assert.assertEquals
import org.junit.Test
import org.quickping.app.model.Server

class VipSelectionFallbackTest {
    private fun server(id: String, vip: Boolean = false, selectable: Boolean = true) = Server(
        id = id,
        countryCode = "de",
        countryName = "Germany",
        title = id,
        accessTier = if (vip) "VIP" else "STANDARD",
        requiresVip = vip,
        locked = !selectable,
        canConnect = selectable,
    )

    @Test
    fun `VIP revocation falls back from locked VIP to standard server`() {
        val servers = listOf(
            server("vip", vip = true, selectable = false),
            server("standard", selectable = true),
        )
        assertEquals("standard", resolveSelectedServerId("vip", servers))
    }

    @Test
    fun `standard selection remains available without VIP entitlement`() {
        val servers = listOf(
            server("standard", selectable = true),
            server("vip", vip = true, selectable = false),
        )
        assertEquals("standard", resolveSelectedServerId("standard", servers))
    }
}
''')
          PY
      - name: Commit focused edits
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android
          git commit -m "Restore VIP crown and fix category/VIP fallback logic"
          git push origin HEAD:fix/restore-vip-crown-gaming-unlimited

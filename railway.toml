[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm --workspace @quickping/control-plane run start"
healthcheckPath = "/api/v1/health/vip"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Require the VIP-aware image and additive VIP schema before production cutover.
